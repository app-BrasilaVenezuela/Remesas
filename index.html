      if ($("#b-saved")) $("#b-saved").onchange = (e) => {
        const b = saved.find((x) => x.id === e.target.value);
        OP.benForm = b ? Object.assign({}, b.fields) : {};
        $$("[data-f]", app).forEach((el) => { const v = OP.benForm[el.dataset.f]; if (v !== undefined) el.value = v; });
      };
      $$("[data-f]", app).forEach((el) => (el.oninput = el.onchange = () => { OP.benForm[el.dataset.f] = el.value; }));
      $("#b-save").onchange = (e) => (OP.saveBen = e.target.checked);
      $("#b-next").onclick = async () => {
        const data = {};
        fields.forEach((f) => { const k = f[0]; const el = $(`[data-f="${k}"]`, app); data[k] = el ? el.value : (OP.benForm[k] || ""); });
        for (const f of fields) { const k = f[0], validate = f[3]; if (!validate(data[k], data)) return ($("#b-err").textContent = tt("ops_field_check", { field: fieldLabelT(k) })); }
        OP.benForm = data;
        $("#b-next").disabled = true;
        try {
          if (OP.saveBen) await saveBeneficiary(country, OP.chosenBenMethod, data, data.fullName || data.phone || data.bank || METHOD_LABEL[OP.chosenBenMethod]);
          await patchOperation({ beneficiaries: [{ method: OP.chosenBenMethod, fields: data, amount: total }] }, "Datos del beneficiario registrados.");
          go("review");
        } catch (e) { console.error("guardar beneficiario:", e); $("#b-err").textContent = friendlyError(e); $("#b-next").disabled = false; }
      };
      return;
    }

    // ---------- Modo repartido: el mismo pago se divide entre varios beneficiarios ----------
    const assigned = OP.benList.reduce((s, b) => s.plus(C.parseNumber(b.amount) || 0), new D(0));
    const remaining = new D(total).minus(assigned);
    app.innerHTML = header(tt("ops_b_title"), tt("ops_b_step", { country: countryNameT(q.to) }), tt("ops_back"), true) + `
      <div class="card stack">
        <label class="switch"><span class="hint" style="margin:0">${esc(tt("ops_b_split"))}</span><input type="checkbox" id="b-multi" checked></label>
        <div class="hint" style="margin:0">${esc(tt("ops_b_split_total", { total: total + " " + q.toCurrency }))}</div>
      </div>
      ${OP.benList.map((b, i) => {
        const fields = beneficiaryFields(country, b.method);
        const saved = OP.myBeneficiaries.filter((sb) => sb.method === b.method);
        return `<div class="card stack ben-block" data-idx="${i}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <h3 style="margin:0">${esc(tt("ops_b_split_n", { n: i + 1 }))}</h3>
            ${OP.benList.length > 2 ? `<button class="link-btn ben-remove" data-idx="${i}" style="color:var(--danger)">${esc(tt("ops_b_remove"))}</button>` : ""}
          </div>
          <label class="field"><span>${esc(tt("ops_b_split_amount", { cur: q.toCurrency }))}</span><input class="input ben-amount" data-idx="${i}" inputmode="decimal" value="${esc(b.amount)}"></label>
          ${methods.length > 1 ? `<div class="chips">${methods.map((m) => `<button class="chip ben-method" data-idx="${i}" data-m="${m}" aria-pressed="${m === b.method}">${esc(methodLabelT(m))}</button>`).join("")}</div>` : ""}
          ${saved.length ? `<label class="field"><span>${esc(tt("ops_b_saved"))}</span><select class="ben-saved" data-idx="${i}"><option value="">${esc(tt("ops_b_new"))}</option>${saved.map((sb) => `<option value="${sb.id}">${esc(sb.label)}</option>`).join("")}</select></label>` : ""}
          <div class="stack ben-fields" data-idx="${i}">${fields.map((f) => fieldInput(f, b.form[f[0]], true)).join("")}</div>
        </div>`;

      <div class="card stack">
        ${OP.benList.length < MAX_SPLIT ? `<button class="ghost" id="ben-add">${esc(tt("ops_b_add"))}</button>` : ""}
        <div class="kv" style="border:0"><span>${esc(tt("ops_b_remaining"))}</span><strong id="ben-remaining-val" style="color:${remaining.eq(0) ? "inherit" : "var(--danger)"}">${esc(remaining.toFixed(2))} ${esc(q.toCurrency)}</strong></div>
        <div class="err" id="b-err"></div>
        <button class="primary" id="b-next" style="margin-top:0">${esc(tt("ops_b_next"))}</button>
      </div>`;
    wireBack(app, () => go("receipt"));
    wireCancelButton(app);
    $("#b-multi").onchange = (e) => { OP.multiBen = e.target.checked; screenBeneficiary(app); };
    $("#ben-add").onclick = () => { OP.benList.push({ method: methods[0], amount: "", form: {} }); screenBeneficiary(app); };
    $$(".ben-remove", app).forEach((btn) => (btn.onclick = () => { OP.benList.splice(Number(btn.dataset.idx), 1); screenBeneficiary(app); }));
    $$(".ben-amount", app).forEach((el) => (el.oninput = () => { OP.benList[Number(el.dataset.idx)].amount = el.value; updateRemaining(); }));
    $$(".ben-method", app).forEach((c) => (c.onclick = () => { const i = Number(c.dataset.idx); OP.benList[i].method = c.dataset.m; OP.benList[i].form = {}; screenBeneficiary(app); }));
    $$(".ben-saved", app).forEach((sel) => (sel.onchange = (e) => {
      const i = Number(sel.dataset.idx), chosen = OP.myBeneficiaries.find((sb) => sb.id === e.target.value);

    $$(".ben-fields [data-f]", app).forEach((el) => (el.oninput = el.onchange = () => {

    $("#b-next").onclick = async () => {

        fields.forEach((f) => { const k = f[0]; const el = $(`.ben-fields[data-idx="${i}"] [data-f="${k}"]`, app); data[k] = el ? el.value : (b.form[k] || ""); });

    };
  }

  const PURPOSES = ["family", "health", "housing", "education", "food", "emergency", "other"];

      <div class="card stack">

function screenDone(app) {

    list.sort((a, b) => (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0) || tsMillis(b.createdAt) - tsMillis(a.createdAt));
    return list;
  }

    return "";

  /** Traduce una nota del historial (texto fijo en español) al idioma del cliente, si se reconoce. */
  const NOTE_MAP = {
    "Operación creada.": "hist_created", "Comprobante recibido.": "hist_receipt",
    "Datos del beneficiario registrados.": "hist_beneficiary_set", "Cliente confirmó la operación.": "hist_client_confirmed",
    "Administrador puso el pago en revisión.": "hist_admin_review", "Administrador confirmó el pago.": "hist_admin_confirmed",
    "Administrador rechazó el pago.": "hist_admin_rejected", "Operación completada.": "hist_completed",
    "Transferencia enviada al beneficiario.": "hist_transfer_sent", "Administrador subió el comprobante de envío.": "hist_transfer_receipt",
    "Administrador canceló la operación.": "hist_admin_cancelled", "Cargada manualmente (operación anterior a la app).": "hist_manual_loaded",
    "Anulada por el administrador (carga manual incorrecta).": "hist_voided"
  };
  function translateNote(note, L) {
    if (!note) return note;
    if (NOTE_MAP[note]) return C.t(NOTE_MAP[note], L);
    let m = /^Cliente inició el pago por (.+)\.$/.exec(note);
    if (m) return C.t("hist_pay_started", L, { method: m[1] });
    m = /^Pago repartido entre (\d+) beneficiarios\.$/.exec(note);
    if (m) return C.t("hist_split", L, { n: m[1] });
    m = /^Administrador editó los datos del beneficiario (\d+)\.$/.exec(note);
    if (m) return C.t("hist_ben_edited", L, { n: m[1] });
    return note; // nota libre (ej. la que el admin escribe al cargar una operación anterior): se deja tal cual
  }
  function historyList(hist, T) {
    return `<div class="timeline">${(hist || []).slice().reverse().map((h) => `<div class="tl-item"><span class="tl-dot"></span><div><strong>${esc(T ? statusLabelT(h.status) : ((STATUS[h.status] || {}).label || h.status))}</strong><div class="hint" style="margin:2px 0 0">${esc(translateNote(h.note, T ? lang() : "es"))}</div><div class="hint" style="margin:0">${esc(new Date(h.at).toLocaleString(T ? lang() : "es"))}</div></div></div>`).join("")}</div>`;

  const ACCOUNT_TYPES = { BR: ["pix"], VE: ["pago_movil", "transferencia"], AR: ["transferencia", "psp"], ZL: ["zelle"], UT: ["usdt_wallet", "usdt_id"] };

  /* ---------- Comprobante de la operación (imagen PNG que el cliente guarda o comparte) ---------- */
  const RCP_SENSITIVE = ["pixKey", "accountNumber", "cbu", "cvu", "aliasCvu", "alias", "walletAddress", "userId", "docNumber", "phone", "contactValue"];
  const maskTail = (v) => { const s = String(v || ""); return s.length <= 4 ? s : "••••" + s.slice(-4); }; // no se muestran datos completos en una imagen que se puede compartir
  /** Equivalente en dólares BCV de los bolívares de la operación (null si la ruta no involucra bolívares). */
  function opBcvUsd(o) {
    try {
      if (o.amounts.bcvUsd) return C.formatBcvUsd(new Decimal(o.amounts.bcvUsd));
      const b = o.rateSnapshot && o.rateSnapshot.bcv && new Decimal(o.rateSnapshot.bcv.value);
      if (!b || !b.gt(0)) return null;
      const r = o.route;
      const ves = r.toCurrency === "VES" ? o.amounts.receive : r.fromCurrency === "VES" ? o.amounts.send : null;
      return ves === null ? null : C.formatBcvUsd(new Decimal(ves).div(b).toDecimalPlaces(2));
    } catch (e) { return null; }
  }
  function rcpNum(x) { try { return C.formatNumber(new Decimal(x), 2); } catch (e) { return String(x); } }

  function receiptData(o) {
    const L = lang(), biz = (window.RemesasCalc && window.RemesasCalc.getBusiness && window.RemesasCalc.getBusiness()) || { name: "Remesas", logo: "" };
    const cn = (id) => COUNTRY_FLAG[id] + " " + C.countryNameFor(id, COUNTRY_NAME[id], L);
    const a = o.amounts, r = o.route;
    const rows = [[tt("ops_v_route"), cn(r.from) + "  →  " + cn(r.to)], [tt("ops_v_sends"), rcpNum(a.send) + " " + r.fromCurrency]];
    rows.push([tt("rcp_total"), rcpNum(a.total) + " " + r.fromCurrency]); // el comprobante del cliente no lleva el detalle de la comisión
    if (o.rateSnapshot && o.rateSnapshot.rate && o.rateSnapshot.rate.text) rows.push([tt("rcp_rate"), o.rateSnapshot.rate.text]);
    if (opBcvUsd(o)) rows.push([tt("result_bcv_usd"), opBcvUsd(o)]);
    if (o.payMethod) rows.push([tt("rcp_method"), methodLabelT(o.payMethod)]);
    const bens = (getBeneficiaries(o) || []).map((b) => {
      const f = b.fields || {}, k = RCP_SENSITIVE.find((x) => f[x]);
      return { name: f.fullName || f.holderName || "", method: methodLabelT(b.method), detail: k ? fieldLabelT(k) + ": " + maskTail(f[k]) : "", amount: bens_amount(b, r) };
    });
    const t = tsMillis(o.createdAt) || Date.now();
    const digits = waBase(o).replace(/\D/g, "");
    return {
      biz, title: tt("rcp_title"), number: opNum(o.number), date: new Date(t).toLocaleString(L),
      status: statusLabelT(o.status), done: o.status === "COMPLETED",
      rows, receive: [tt("ops_v_receives"), rcpNum(a.receive) + " " + r.toCurrency],
      benTitle: tt("rcp_beneficiary"), bens, multi: bens.length > 1,
      note: o.status === "COMPLETED" ? tt("rcp_note_done") : tt("rcp_note"),
      contact: digits ? tt("rcp_contact", { phone: "+" + digits }) : "", generated: tt("rcp_generated", { date: new Date().toLocaleString(L) })
    };
  }
  function bens_amount(b, r) { return b.amount !== undefined && b.amount !== "" ? rcpNum(b.amount) + " " + r.toCurrency : ""; }

  function rcpWrap(ctx, text, maxW) {
    const words = String(text).split(/\s+/), lines = []; let cur = "";
    words.forEach((w) => { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });

  }
  function rcpRoundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  /** Dibuja el comprobante y devuelve la altura usada. */
  function drawReceipt(ctx, W, d, logo) {
    const P = 56, CW = W - 2 * P, INK = "#10201A", MUTED = "#5B6B64", ACC = "#0B6E4F", LINE = "#DDE5E0";
    const F = (w, s) => w + " " + s + "px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif";
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, 4000);
    // Encabezado
    ctx.fillStyle = ACC; ctx.fillRect(0, 0, W, 210);
    let tx = P;
    if (logo) { const lh = 130, lw = Math.min(200, (logo.width / logo.height) * lh); ctx.fillStyle = "#fff"; rcpRoundRect(ctx, P, 40, lw + 20, lh + 20, 22); ctx.fill(); ctx.drawImage(logo, P + 10, 50, lw, lh); tx = P + lw + 50; }
    ctx.fillStyle = "#fff"; ctx.textBaseline = "alphabetic";
    ctx.font = F("700", 40); const tl = rcpWrap(ctx, d.title, W - tx - P); tl.forEach((ln, i) => ctx.fillText(ln, tx, 100 + i * 46));
    ctx.font = F("500", 26); ctx.globalAlpha = 0.85; ctx.fillText(rcpWrap(ctx, d.biz.name, W - tx - P)[0] || "", tx, 100 + tl.length * 46 + 6); ctx.globalAlpha = 1;
    // Número, fecha y estado
    let y = 290;
    ctx.fillStyle = INK; ctx.font = F("800", 68); ctx.fillText(d.number, P, y);
    ctx.fillStyle = MUTED; ctx.font = F("500", 28); ctx.fillText(d.date, P, y + 46);
    ctx.font = F("700", 26); const sw = ctx.measureText(d.status).width + 44;
    ctx.fillStyle = d.done ? "#DDF3E7" : "#FFF1D6"; rcpRoundRect(ctx, W - P - sw, y - 46, sw, 52, 26); ctx.fill();
    ctx.fillStyle = d.done ? ACC : "#8A5A00"; ctx.fillText(d.status, W - P - sw + 22, y - 10);
    y += 90; ctx.fillStyle = LINE; ctx.fillRect(P, y, CW, 2); y += 22;
    // Filas
    d.rows.forEach((r) => {
      ctx.font = F("500", 28); ctx.fillStyle = MUTED; const lab = rcpWrap(ctx, r[0], CW * 0.42);
      ctx.font = F("700", 30); ctx.fillStyle = INK; const val = rcpWrap(ctx, r[1], CW * 0.56);
      const n = Math.max(lab.length, val.length), h = 30 + n * 38;
      ctx.font = F("500", 28); ctx.fillStyle = MUTED; lab.forEach((ln, i) => ctx.fillText(ln, P, y + 42 + i * 38));
      ctx.font = F("700", 30); ctx.fillStyle = INK; ctx.textAlign = "right"; val.forEach((ln, i) => ctx.fillText(ln, W - P, y + 42 + i * 38)); ctx.textAlign = "left";
      y += h + 6; ctx.fillStyle = LINE; ctx.fillRect(P, y, CW, 1); y += 6;
    });
    // Recibe (destacado)
    y += 14; ctx.fillStyle = "#EAF6F0"; rcpRoundRect(ctx, P, y, CW, 110, 22); ctx.fill();
    ctx.fillStyle = MUTED; ctx.font = F("600", 28); ctx.fillText(d.receive[0], P + 28, y + 66);
    ctx.fillStyle = ACC; ctx.font = F("800", 42); ctx.textAlign = "right"; ctx.fillText(d.receive[1], W - P - 28, y + 70); ctx.textAlign = "left";
    y += 110 + 40;
    // Beneficiario(s)
    if (d.bens.length) {
      ctx.fillStyle = INK; ctx.font = F("800", 32); ctx.fillText(d.benTitle, P, y); y += 22;
      d.bens.forEach((b, i) => {
        y += 30; ctx.fillStyle = INK; ctx.font = F("700", 30);
        const nm = (d.multi ? (i + 1) + ". " : "") + (b.name || b.method);
        ctx.fillText(rcpWrap(ctx, nm, CW * 0.62)[0], P, y);
        if (b.amount) { ctx.textAlign = "right"; ctx.fillStyle = ACC; ctx.fillText(b.amount, W - P, y); ctx.textAlign = "left"; }
        y += 38; ctx.fillStyle = MUTED; ctx.font = F("500", 26);
        const sub = [b.name ? b.method : "", b.detail].filter(Boolean).join("  ·  ");
        if (sub) { rcpWrap(ctx, sub, CW).forEach((ln) => { ctx.fillText(ln, P, y); y += 34; }); }
      });
      y += 20;
    }
    // Nota y pie
    ctx.fillStyle = LINE; ctx.fillRect(P, y, CW, 2); y += 40;
    ctx.fillStyle = MUTED; ctx.font = F("500", 26);
    rcpWrap(ctx, d.note, CW).forEach((ln) => { ctx.fillText(ln, P, y); y += 36; });
    y += 30;
    const fh = 140; ctx.fillStyle = "#F3F6F4"; ctx.fillRect(0, y, W, fh);
    ctx.textAlign = "center"; ctx.fillStyle = INK; ctx.font = F("700", 28); if (d.contact) ctx.fillText(d.contact, W / 2, y + 56);
    ctx.fillStyle = MUTED; ctx.font = F("500", 24); ctx.fillText(d.generated, W / 2, y + 100); ctx.textAlign = "left";
    return y + fh;
  }

  /* ---------- Control de pagos: cuánto entró, cuánto salió, con qué cuenta ---------- */
  const RECEIVED_STATUSES = ["PAYMENT_CONFIRMED", "TRANSFER_IN_PROGRESS", "COMPLETED"]; // el operador ya verificó que el dinero llegó
  const PENDING_STATUSES = ["PENDING_PAYMENT", "RECEIPT_UPLOADED", "PAYMENT_REVIEW"];   // el cliente dice haber pagado, falta confirmar
  const RANGE_LABEL = { today: "Hoy", "7": "7 días", "30": "30 días", all: "Todo" };
  function rangeCutoff(range) {
    if (range === "all") return 0;
    const d = new Date();
    if (range === "today") { d.setHours(0, 0, 0, 0); return d.getTime(); }
    d.setDate(d.getDate() - Number(range)); return d.getTime();
  }
  /** Suma amounts[amountKey] agrupado por route[currencyKey], para las operaciones que cumplan filterFn. */
  function sumGrouped(ops, filterFn, amountKey, currencyKey) {
    const totals = {}, counts = {};
    ops.filter(filterFn).forEach((o) => {
      const cur = o.route[currencyKey]; if (!cur) return;
      const amt = new Decimal(o.amounts[amountKey] || 0);
      totals[cur] = (totals[cur] || new Decimal(0)).plus(amt);
      counts[cur] = (counts[cur] || 0) + 1;
    });
    return { totals, counts };
  }
  function moneyRows(totals, counts) {
    return Object.keys(totals).sort().map((cur) => `<div class="kv"><span>${esc(cur)} <span class="hint" style="margin:0">(${counts[cur]})</span></span><strong>${esc(C.formatNumber(totals[cur], 2))}</strong></div>`).join("")
      || '<div class="hint">Sin movimientos.</div>';
  }
  /** Descarga un archivo de texto (CSV). Dentro de la app usa el guardado nativo (más confiable);
   *  en un navegador normal, el mecanismo de siempre (funciona bien ahí). */
  function downloadText(filename, text, mime) {
    if (window.RemesasApp && window.RemesasApp.saveFile) {
      try { window.RemesasApp.saveFile(filename, text); return; } catch (e) { /* si falla, probamos la vía de navegador abajo */ }
    }
    const blob = new Blob(["\uFEFF" + text], { type: mime || "text/csv;charset=utf-8;" }); // BOM: para que Excel muestre bien las tildes
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function exportOperationsCSV(ops, rangeLabel) {

          <div class="hint" style="margin:0">Operaciones completadas: dinero que ya salió hacia el beneficiario.</div>
          ${moneyRows(sent.totals, sent.counts)}
        </div>
        <div class="card stack">
          <h3 style="margin:0">🧾 Comisión ganada</h3>
          ${moneyRows(fees.totals, fees.counts)}
        </div>
        <div class="card stack">
          <h3 style="margin:0">🟡 Por confirmar</h3>
          <div class="hint" style="margin:0">El cliente dice haber pagado; todavía sin verificar.</div>
          ${moneyRows(pending.totals, pending.counts)}
        </div>
        <div class="card stack">
          <h3 style="margin:0">🔵 En camino al beneficiario</h3>
          <div class="hint" style="margin:0">Pago confirmado, marcado como transferencia en proceso.</div>
          ${moneyRows(inTransit.totals, inTransit.counts)}
        </div>
        <div class="card stack">
          <h3 style="margin:0">🏦 Recibido por cuenta</h3>
          <div class="hint" style="margin:0">Para cuadrar contra tus cuentas reales.</div>
          ${accountRows}
        </div>
        <button class="ghost" id="pay-export" style="width:100%">⬇️ Exportar a CSV (${RANGE_LABEL[OP.admin.paymentsRange]})</button>`;
      $("#pay-export").onclick = () => exportOperationsCSV(ops, RANGE_LABEL[OP.admin.paymentsRange]);
    }).catch((e) => { console.error("control de pagos:", e); $("#pay-body").innerHTML = `<div class="alert">${esc(friendlyError(e))}</div>`; });
  }

      <div class="card stack"><h3 style="margin:0">Agregar cuenta</h3>
        <div class="grid2">
          <label class="field"><span>País / método</span><select id="aa-country"><option value="BR">🇧🇷 Brasil</option><option value="VE">🇻🇪 Venezuela</option><option value="AR">🇦🇷 Argentina</option><option value="ZL">💵 Zelle</option><option value="UT">🪙 USDT</option></select></label>
          <label class="field"><span>Método</span><select id="aa-method"></select></label>
        </div>
        <label class="field"><span>Etiqueta (para identificarla tú)</span><input class="input" id="aa-label" placeholder="Ej. PIX principal"></label>
        <div id="aa-fields" class="stack"></div>
        <label class="ghost file-btn">Subir código QR (opcional)<input type="file" accept="image/*" class="sr" id="aa-qr"></label>
        <div id="aa-qr-prev"></div>
        <div class="err" id="aa-err"></div>
        <button class="primary" id="aa-add" style="margin-top:0">Guardar cuenta</button>
      </div>`;
    wireBack(app, () => go("opsList"));
    let qrData = "";
    function methodOptions() { const c = $("#aa-country").value; TX_COUNTRY = c; $("#aa-method").innerHTML = ACCOUNT_TYPES[c].map((m) => `<option value="${m}">${esc(METHOD_LABEL[m])}</option>`).join(""); renderFields(); }
    function renderFields() { const m = $("#aa-method").value; $("#aa-fields").innerHTML = accountFields(m).map((f) => fieldInput(f, "")).join(""); }
    $("#aa-country").onchange = methodOptions; methodOptions();
    $("#aa-method").onchange = renderFields;
    $("#aa-qr").onchange = (e) => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const img = new Image(); const reader = new FileReader();
      reader.onload = () => { img.onload = () => { const cv = document.createElement("canvas"); const s = Math.min(1, 500 / Math.max(img.width, img.height)); cv.width = img.width * s; cv.height = img.height * s; cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); qrData = cv.toDataURL("image/png"); $("#aa-qr-prev").innerHTML = `<img src="${qrData}" style="width:100px;height:100px;object-fit:contain;margin-top:6px">`; }; img.src = reader.result; };
      reader.readAsDataURL(f);
    };
    function renderList() {
      loadScopedAccounts(true).then((accs) => {
        $("#aa-list").innerHTML = accs.length ? accs.map((a) => `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <strong>${esc(COUNTRY_FLAG[a.country] || "")} ${esc(METHOD_LABEL[a.method])}${a.label ? " — " + esc(a.label) : ""}</strong>${OP.role === "gm" && ownerOf(a) !== MAIN ? ` <span class="hint" style="margin:0">👤 ${esc(OP.opNames[ownerOf(a)] || "Operador")}</span>` : ""}
              <label class="switch" style="gap:8px"><input type="checkbox" data-active="${a.id}" ${a.active ? "checked" : ""}></label>
            </div>
            <div class="hint" style="margin-top:6px">${accountSummary(a).map((r) => r[0] + ": " + r[1]).join(" · ")}</div>
            <button class="link-btn" data-del="${a.id}" style="color:var(--danger)">Eliminar</button>
          </div>`).join("") : '<div class="empty">Todavía no registras cuentas.</div>';
        $$("[data-active]", app).forEach((el) => (el.onchange = () => db.collection("operatorAccounts").doc(el.dataset.active).update({ active: el.checked }).then(() => toast(el.checked ? "Cuenta activada" : "Cuenta desactivada"))));
        $$("[data-del]", app).forEach((el) => (el.onclick = () => { if (confirm("¿Eliminar esta cuenta?")) db.collection("operatorAccounts").doc(el.dataset.del).delete().then(renderList); }));
      }).catch((e) => { console.error("listar cuentas:", e); $("#aa-list").innerHTML = `<div class="alert">${esc(friendlyError(e))}</div>`; });
    }
    renderList();
    $("#aa-add").onclick = async () => {
      const country = $("#aa-country").value, method = $("#aa-method").value;
      const fields = accountFields(method); const data = { country, method, label: $("#aa-label").value.trim(), active: true, qr: qrData || null, operatorUid: OP.role === "operator" ? OP.myUid : MAIN };
      fields.forEach((f) => { const k = f[0]; const el = $(`[data-f="${k}"]`, app); data[k] = el ? el.value : ""; });
      for (const f of fields) { const k = f[0], label = f[1], validate = f[3]; if (!validate(data[k], data)) return ($("#aa-err").textContent = `Revisa el campo "${label}".`); }
      $("#aa-add").disabled = true;
      try { await db.collection("operatorAccounts").add(data); toast("Cuenta guardada ✓"); qrData = ""; $("#aa-label").value = ""; renderFields(); $("#aa-qr-prev").innerHTML = ""; renderList(); }
      catch (e) { console.error("guardar cuenta:", e); $("#aa-err").textContent = friendlyError(e); }
      $("#aa-add").disabled = false;
    };
  }

  /* ---------- Operadores (solo el GM): alta, enlace y activar/desactivar ---------- */
  const SLUG_RE = /^[a-z0-9][a-z0-9-]{1,23}$/, RESERVED_SLUGS = ["main", "principal", "admin", "operador", "panel"];
  function copyLink(text) { return navigator.clipboard.writeText(text).then(() => toast("Enlace copiado ✓")).catch(() => toast("No se pudo copiar. Mantén presionado el enlace para copiarlo.")); }
  function screenAdminOperators(app) {
    if (OP.role !== "gm") { go("opsList"); return; }
    app.innerHTML = header("Operadores", "Administradores independientes", "Volver") + `
      <div class="stack" id="op-list"><div class="hint">Cargando…</div></div>
      <div class="card stack"><h3 style="margin:0">Agregar operador</h3>
        <div class="hint" style="margin:0">1) En Firebase → Authentication → Users → "Agregar usuario", crea su correo y contraseña. 2) Copia el UID de ese usuario y pégalo aquí.</div>
        <label class="field"><span>UID del usuario (Firebase)</span><input class="input" id="ao-uid" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
        <label class="field"><span>Nombre</span><input class="input" id="ao-name"></label>
        <label class="field"><span>Código del enlace (letras minúsculas, números y guion)</span><input class="input" id="ao-slug" autocomplete="off" autocapitalize="off" placeholder="ej. maria"></label>
        <label class="field"><span>WhatsApp con código de país</span><input class="input" id="ao-wa" inputmode="tel" placeholder="ej. +58 414 1234567"></label>
        <div class="err" id="ao-err"></div>
        <button class="primary" id="ao-add" style="margin-top:0">Guardar operador</button>
      </div>`;
    wireBack(app, () => go("opsList"));
    function renderOps() {
      loadOperators().then((list) => {
        $("#op-list").innerHTML = list.length ? list.map((o) => `
          <div class="card stack">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><strong>${esc(o.name || o.slug)}</strong>
              <label class="switch" style="gap:8px"><input type="checkbox" data-act="${esc(o.uid)}" ${o.active ? "checked" : ""}></label></div>
            <div class="hint" style="margin:0;word-break:break-all">${esc(opLink(o.slug))}</div>
            <div class="hint" style="margin:0">WhatsApp: ${esc(o.whatsapp || "—")}${o.active ? "" : " · INACTIVO: sus clientes ya no le llegan a él/ella"}</div>
            <div class="grid2"><button class="ghost" data-copy="${esc(o.slug)}">Copiar enlace</button><button class="ghost" data-view="${esc(o.uid)}">Ver sus órdenes</button></div>
          </div>`).join("") : '<div class="empty">Todavía no hay operadores.</div>';
        $$("[data-copy]", app).forEach((b) => (b.onclick = () => copyLink(opLink(b.dataset.copy))));
        $$("[data-view]", app).forEach((b) => (b.onclick = () => { OP.admin.scope = b.dataset.view; try { localStorage.setItem("remesas:gm_scope", OP.admin.scope); } catch (e) { /* sin almacenamiento */ } go("opsList"); }));
        $$("[data-act]", app).forEach((el) => (el.onchange = () => db.collection("operators").doc(el.dataset.act).update({ active: el.checked }).then(() => { toast(el.checked ? "Operador activado" : "Operador desactivado"); renderOps(); }).catch((e) => toast(friendlyError(e)))));
      }).catch((e) => { console.error("operadores:", e); $("#op-list").innerHTML = `<div class="alert">${esc(friendlyError(e))}</div>`; });
    }
    renderOps();
    $("#ao-add").onclick = async () => {
      const uid = $("#ao-uid").value.trim(), name = $("#ao-name").value.trim(), slug = $("#ao-slug").value.trim().toLowerCase();
      const wa = String($("#ao-wa").value || "").replace(/\D/g, "");
      const err = (m) => { $("#ao-err").textContent = m; };
      if (!/^[A-Za-z0-9]{20,40}$/.test(uid)) return err("El UID no parece válido. Cópialo completo desde Firebase → Authentication.");
      if (ADMIN_UIDS.indexOf(uid) !== -1) return err("Ese usuario es administrador principal; no puede ser operador.");
      if (!name) return err("Escribe el nombre del operador.");
      if (!SLUG_RE.test(slug) || RESERVED_SLUGS.indexOf(slug) !== -1) return err("El código del enlace debe tener 2 a 24 caracteres (minúsculas, números o guion) y no puede ser \"" + RESERVED_SLUGS.join("\", \"") + "\".");
      if (wa.length < 8 || wa.length > 15) return err("Escribe el WhatsApp con código de país (8 a 15 dígitos).");
      $("#ao-add").disabled = true; err("");
      try {
        const list = OP.operators.length ? OP.operators : await loadOperators();
        if (list.some((o) => o.uid === uid)) throw { custom: "Ese usuario ya está registrado como operador." };
        if (list.some((o) => o.slug === slug)) throw { custom: "Ese código de enlace ya lo usa otro operador." };
        await db.collection("operators").doc(uid).set({ name, slug, whatsapp: wa, active: true, createdAt: FieldValue.serverTimestamp() });
        toast("Operador guardado ✓");
        ["ao-uid", "ao-name", "ao-slug", "ao-wa"].forEach((id) => { $("#" + id).value = ""; });
        renderOps();
      } catch (e) { console.error("guardar operador:", e); err(e && e.custom ? e.custom : friendlyError(e)); }
      $("#ao-add").disabled = false;
    };
  }

  /* ---------- Mi enlace (operador): su enlace para clientes y su WhatsApp ---------- */
  function screenAdminMyLink(app) {
    if (OP.role !== "operator" || !OP.operator) { go("opsList"); return; }
    const me = OP.operator, link = opLink(me.slug);
    app.innerHTML = header("Mi enlace", me.name || "", "Volver") + `
      <div class="card stack">
        <div class="hint" style="margin:0">Los clientes que entren por este enlace verán tus cuentas de cobro y sus órdenes te llegarán solo a ti.</div>
        <div class="card" style="word-break:break-all;font-weight:600">${esc(link)}</div>
        <div class="grid2"><button class="ghost" id="ml-copy">Copiar enlace</button><a class="wa" id="ml-share" href="${esc("https://wa.me/?text=" + encodeURIComponent(link))}" target="_blank" rel="noopener">Compartir por WhatsApp</a></div>
      </div>
      <div class="card stack">
        <h3 style="margin:0">Tu WhatsApp</h3>
        <div class="hint" style="margin:0">A este número escriben tus clientes desde el botón "Conversa con nosotros" y el resumen de cada operación.</div>
        <label class="field"><span>WhatsApp con código de país</span><input class="input" id="ml-wa" inputmode="tel" value="${esc(me.whatsapp || "")}"></label>
        <div class="err" id="ml-err"></div>
        <button class="primary" id="ml-save" style="margin-top:0">Guardar WhatsApp</button>
      </div>`;
    wireBack(app, () => go("opsList"));
    $("#ml-copy").onclick = () => copyLink(link);
    $("#ml-save").onclick = async () => {
      const wa = String($("#ml-wa").value || "").replace(/\D/g, "");
      if (wa.length < 8 || wa.length > 15) return ($("#ml-err").textContent = "Escribe el WhatsApp con código de país (8 a 15 dígitos).");
      $("#ml-save").disabled = true; $("#ml-err").textContent = "";
      try { await db.collection("operators").doc(me.uid).update({ whatsapp: wa }); me.whatsapp = wa; toast("WhatsApp guardado ✓"); }
      catch (e) { console.error("guardar WhatsApp:", e); $("#ml-err").textContent = friendlyError(e); }
      $("#ml-save").disabled = false;
    };
  }

  /* ---------- Retomar una operación que el cliente dejó a medias ---------- */
  function getDismissed() { try { return JSON.parse(localStorage.getItem("remesas:dismissed_ops") || "[]"); } catch (e) { return []; } }
  function dismissOp(id) { try { const d = getDismissed(); if (d.indexOf(id) === -1) { d.push(id); localStorage.setItem("remesas:dismissed_ops", JSON.stringify(d)); } } catch (e) { /* localStorage no disponible: no pasa nada grave */ } }

  /** Reconstruye un objeto parecido a una cotización a partir de los datos ya guardados en la operación (sin recalcular con las tasas actuales). */
  function quoteFromOperation(o) {
    const flagOf = (label) => (label || "").split(" ")[0];
    const nameOf = (label) => (label || "").split(" ").slice(1).join(" ");
    const rate = o.rateSnapshot && o.rateSnapshot.rate;
    const bcv = o.rateSnapshot && o.rateSnapshot.bcv;
    return {
      from: { id: o.route.from, flag: flagOf(o.route.fromLabel), name: nameOf(o.route.fromLabel) },
      to: { id: o.route.to, flag: flagOf(o.route.toLabel), name: nameOf(o.route.toLabel) },
      fromCurrency: o.route.fromCurrency, toCurrency: o.route.toCurrency,
      shown: { send: new Decimal(o.amounts.send), receive: new Decimal(o.amounts.receive), fee: new Decimal(o.amounts.fee || 0), total: new Decimal(o.amounts.total) },
      hasFee: o.amounts.hasFee, feeIncluded: o.amounts.feeIncluded, appliedPercent: o.amounts.appliedPercent, lowAmount: o.amounts.lowAmount, minRequired: null,
      ratesUsed: rate ? [{ key: "x", reference: false, text: rate.text, value: rate.value, fullLabel: rate.label }].concat(bcv ? [{ key: "BCV_USD_VES", reference: true, value: bcv.value }] : []) : [],
      intermediates: [], bcvUsd: null
    };
  }

  async function resumeOperation(o) {
    OP.op = o; OP.opId = o.id;
    OP.draftQuote = quoteFromOperation(o);
    OP.multiBen = false; OP.benList = null; OP.chosenBenMethod = null; OP.benForm = {}; OP.saveBen = true;
    try {
      await loadAccounts(ownerOf(o));
      if (o.payAccountId) OP.chosenAccount = OP.accounts.find((a) => a.id === o.payAccountId) || null;
      const bens = getBeneficiaries(o);
      if (bens) { go("review"); return; }
      if (o.status === "RECEIPT_UPLOADED") { OP.myBeneficiaries = await loadMyBeneficiaries(o.route.to); go("beneficiary"); return; }
      if (o.payAccountId) { go("receipt"); return; }
      go("payment");
    } catch (e) { console.error("retomar operación:", e); toast(friendlyError(e)); }
  }

  /** Cancela la operación actual (la que el cliente tiene abierta en este momento del proceso). */
  async function cancelCurrentOperation() {
    if (!confirm(tt("ops_cancel_confirm"))) return;
    try {
      await patchOperation({ status: "CANCELLED" }, "Cliente canceló la operación.");
      if (OP.op) dismissOp(OP.op.id || OP.opId);
      toast(tt("ops_cancel_toast"));
      exitToCalc();
    } catch (e) { console.error("cancelar operación:", e); toast(friendlyError(e)); }
  }
  function wireCancelButton(app) {
    const btn = $("#op-cancel", app); if (!btn) return;
    btn.onclick = cancelCurrentOperation;
  }
  /** Cancela una operación sin terminar desde el aviso de "retomar" (antes de volver a entrar al proceso). */
  async function cancelResumableOp(o) {
    if (!confirm(tt("ops_cancel_confirm"))) return false;
    try {
      await db.collection("operations").doc(o.id).update({ status: "CANCELLED", updatedAt: FieldValue.serverTimestamp(), history: FieldValue.arrayUnion({ at: nowISO(), status: "CANCELLED", note: "Cliente canceló la operación." }) });
      dismissOp(o.id);
      toast(tt("ops_cancel_toast"));
      return true;
    } catch (e) { console.error("cancelar desde aviso:", e); toast(friendlyError(e)); return false; }
  }
  function injectResumeBanner() {
    const old = document.getElementById("resume-banner"); if (old) old.remove();
    if (OP.view || !OP.resumable) return; // solo se muestra sobre la calculadora
    const panel = document.querySelector(".panel"); if (!panel || !panel.parentNode) return;
    const o = OP.resumable;
    const div = document.createElement("div");
    div.id = "resume-banner"; div.className = "card stack"; div.style.marginBottom = "14px"; div.style.border = "2px solid var(--accent)";
    div.innerHTML = `<div class="hint" style="margin:0">${esc(tt("ops_resume_hint"))}</div>
      <strong>${opNum(o.number)} — ${esc(o.route.fromLabel)} → ${esc(o.route.toLabel)}</strong>
      <div class="grid2"><button class="ghost" id="resume-discard">${esc(tt("ops_resume_discard"))}</button><button class="primary" id="resume-continue">${esc(tt("ops_resume_continue"))}</button></div>`;
    panel.parentNode.insertBefore(div, panel);
    document.getElementById("resume-continue").onclick = () => resumeOperation(o);
    document.getElementById("resume-discard").onclick = async () => {
      const btn = document.getElementById("resume-discard"); btn.disabled = true;
      const ok = await cancelResumableOp(o);
      if (ok) { OP.resumable = null; div.remove(); } else btn.disabled = false;
    };
  }

  async function checkResumable() {
    if (isStaff() || !OP.myUid) return;
    try {
      const dismissed = getDismissed();
      const mine = await loadMyOperations();
      OP.mine = mine;
      OP.resumable = mine.find((o) => !getBeneficiaries(o) && TERMINAL.indexOf(o.status) === -1 && dismissed.indexOf(o.id) === -1) || null;
    } catch (e) { OP.resumable = null; }
    injectResumeBanner(); injectRecentOps();
  }

  window.RemesasOps = {
    onQuoteRendered: mountContinueButton,
    onCalcRendered: () => { injectResumeBanner(); injectRecentOps(); decorateNav(document.getElementById("app")); },
    openMyOps: () => go("myops"),
    openAccount: () => go("account"),
    openAdmin: () => { ensureAuth().then(() => { go(isStaff() ? "opsList" : "opsLogin"); }); },
    isStaff: () => isStaff(),
    role: () => OP.role,
    clientWa: () => clientWaOverride(),
    isActive: () => !!OP.view
  };
})();
</script>
<script id="fb-loader">
/* Carga Firebase en segundo plano: la calculadora aparece primero y las operaciones se activan cuando hay conexión. */
(function () {
  var BASE = window.__FB_BASE__ || "https://www.gstatic.com/firebasejs/10.13.2/";
  var MODS = ["app", "app-check", "auth", "firestore"];
  var MSG = {
    es: { slow: "Conectando… la conexión está lenta.", fail: "Sin conexión con el servidor. La calculadora funciona, pero algunas funciones no están disponibles.", retry: "Reintentar" },
    pt: { slow: "Conectando… a conexão está lenta.", fail: "Sem conexão com o servidor. A calculadora funciona, mas algumas funções não estão disponíveis.", retry: "Tentar novamente" },
    en: { slow: "Connecting… the connection is slow.", fail: "No connection to the server. The calculator works, but some features are unavailable.", retry: "Retry" }
  };
  var loaded = {}, running = false, ran = false, note = null, slowTimer = null;
  function lang() { try { var l = window.RemesasCalc.getLang(); return MSG[l] ? l : "es"; } catch (e) { return "es"; } }
  function show(kind) {
    if (ran) return;
    if (!note) {
      note = document.createElement("div"); note.id = "conn-note"; note.setAttribute("role", "status");
      note.style.cssText = "position:fixed;left:8px;right:8px;top:8px;z-index:90;background:#FFF1D6;color:#5a3b00;border:1px solid #E5C77A;border-radius:12px;padding:10px 12px;font:600 .9rem system-ui,sans-serif;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 4px 18px rgba(0,0,0,.15)";
      document.body.appendChild(note);
    }
    var m = MSG[lang()]; note.innerHTML = "";
    var t = document.createElement("span"); t.textContent = kind === "fail" ? m.fail : m.slow; note.appendChild(t);
    if (kind === "fail") {
      var b = document.createElement("button"); b.textContent = m.retry;
      b.style.cssText = "flex:none;border:0;border-radius:10px;padding:8px 12px;font-weight:700;background:#0B6E4F;color:#fff";
      b.onclick = function () { start(); }; note.appendChild(b);
    }
  }
  function hide() { if (note) { note.remove(); note = null; } }
  function loadOne(i, attempt, cb) {
    if (loaded[i]) return cb(true);
    var s = document.createElement("script"), done = false, to;
    function finish(ok) {
      if (done) return; done = true; clearTimeout(to);
      if (ok) { loaded[i] = true; cb(true); return; }
      s.remove();
      if (attempt < 3) setTimeout(function () { loadOne(i, attempt + 1, cb); }, 1200 * attempt); else cb(false);
    }
    to = setTimeout(function () { finish(false); }, 20000);
    s.async = false; s.src = BASE + "firebase-" + MODS[i] + "-compat.js";
    s.onload = function () { finish(true); }; s.onerror = function () { finish(false); };
    document.head.appendChild(s);
  }
  function runOps() {
    if (ran) return; ran = true; clearTimeout(slowTimer); hide();
    var s = document.createElement("script"); s.text = document.getElementById("app-ops").textContent; document.body.appendChild(s);
  }
  function start() {
    if (running || ran) return; running = true;
    clearTimeout(slowTimer); slowTimer = setTimeout(function () { show("slow"); }, 5000);
    (function next(i) {
      if (i >= MODS.length) { running = false; return runOps(); }
      loadOne(i, 1, function (ok) { if (ok) next(i + 1); else { running = false; clearTimeout(slowTimer); show("fail"); } });
    })(0);
  }
  window.addEventListener("online", start);
  setInterval(function () { if (!ran && !running && navigator.onLine !== false) start(); }, 30000);
  start();
  if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); });
})();
</script>
