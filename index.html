<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de remesas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;600;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;600;700&display=swap"></noscript>
<link id="app-head-extra" rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%92%B1%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-check-compat.js">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js">
<style id="app-style">:root{
  --bg:#E6ECE9; --surface:#FFFFFF; --surface-2:#F3F6F4; --ink:#15201C; --muted:#5A6A64;
  --line:#CAD5D0; --accent:#0B6E4F; --accent-ink:#FFFFFF; --accent-soft:#D6EDE4;
  --danger:#A3321A; --danger-soft:#FBE7E1; --wa:#25D366; --wa-ink:#062B17; --ring:rgba(0,0,0,.06);
  --radius-lg:22px; --radius:14px; --radius-sm:10px;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --ui:"Instrument Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1412; --surface:#16201C; --surface-2:#1C2824; --ink:#E3ECE8; --muted:#94A49E;
    --line:#2B3934; --accent:#45C79B; --accent-ink:#04241A; --accent-soft:#183A2F;
    --danger:#FF9C85; --danger-soft:#3A1E17; --ring:rgba(255,255,255,.45); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201C; --surface-2:#1C2824; --ink:#E3ECE8; --muted:#94A49E;
  --line:#2B3934; --accent:#45C79B; --accent-ink:#04241A; --accent-soft:#183A2F;
  --danger:#FF9C85; --danger-soft:#3A1E17; --ring:rgba(255,255,255,.45); color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;
  font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* Cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.25rem;flex:none}
.brand h1{font-family:var(--display);font-size:1.3rem;line-height:1.1;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand p{margin:2px 0 0;font-size:.82rem}
.top-actions{display:flex;gap:8px;flex:none}
.icon-btn{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;font-size:1.05rem;padding:0 12px}

.top.has-logo{flex-direction:column;justify-content:center;position:relative;gap:4px;margin-bottom:14px}
.top.has-logo .top-actions{margin:0}
.logo-img{display:block;width:min(210px,56vw);height:auto;margin:0 auto}
.top.has-logo .updated{margin:0;font-size:.82rem;text-align:center}
.file-btn{display:flex;align-items:center;justify-content:center;cursor:pointer}
.file-btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}

/* Panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px}
.field{display:block}
.field>span,.label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:6px}
select,.input{width:100%;min-height:54px;border-radius:var(--radius);border:1.5px solid var(--line);
  background:var(--surface-2);padding:0 14px;font-size:1.05rem}
select{appearance:none;-webkit-appearance:none;padding-right:36px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
select:focus,.input:focus{border-color:var(--accent);outline:none}
.route{display:grid;grid-template-columns:1fr 40px 1fr;gap:6px;align-items:end}
.route select{font-size:1rem;padding:0 28px 0 10px;background-position:calc(100% - 16px) 50%,calc(100% - 10px) 50%;text-overflow:ellipsis}
.swap{height:54px;border-radius:var(--radius);border:1.5px solid var(--line);background:var(--surface);font-size:1.3rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border:1.5px solid var(--line);
  border-radius:var(--radius);padding:4px;margin:16px 0}
.seg button{min-height:46px;border:0;border-radius:10px;background:transparent;font-weight:600;color:var(--muted);font-size:.95rem;padding:0 4px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1.5px var(--accent)}
.money{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface-2);min-height:64px}
.money:focus-within{border-color:var(--accent)}
.money .cur{padding:0 4px 0 16px;font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--muted)}
.money input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--display);font-size:1.7rem;font-weight:700;
  padding:0 16px 0 6px;height:62px;outline:none}
.primary{width:100%;min-height:56px;border:0;border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);
  font-weight:700;font-size:1.08rem;margin-top:14px}
.primary:disabled{opacity:.5;cursor:not-allowed}
.ghost{min-height:48px;border-radius:var(--radius);border:1.5px solid var(--line);background:var(--surface);font-weight:600;padding:0 16px}

/* Recibo */
#result{margin-top:16px}
.empty{border:1.5px dashed var(--line);border-radius:var(--radius-lg);padding:22px;text-align:center;color:var(--muted)}
.alert{border-radius:var(--radius);padding:14px 16px;background:var(--danger-soft);color:var(--danger);font-weight:600}
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);position:relative;overflow:hidden}
.receipt .head{padding:16px 18px 0;font-weight:600;color:var(--muted);font-size:.92rem}
.receipt .big{padding:6px 18px 18px}
.receipt .big .label{margin:0}
.receipt .big strong{display:block;font-family:var(--display);font-size:clamp(2rem,9vw,2.7rem);line-height:1.1;letter-spacing:-.02em;word-break:break-word}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 18px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-30px}.perf::after{right:-30px}
.receipt dl{margin:0;padding:12px 18px 6px}
.receipt dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--surface-2)}
.receipt dl div:last-child{border-bottom:0}
.receipt dt{color:var(--muted)}
.receipt dd{margin:0;font-weight:600;text-align:right}
.receipt .fee dd{color:var(--muted)}
.receipt .total{border-top:1.5px solid var(--line)!important;margin-top:4px}
.receipt .total dt,.receipt .total dd{color:var(--ink);font-weight:700;font-size:1.08rem}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;margin:8px 18px 18px;border-radius:var(--radius);
  background:var(--wa);color:var(--wa-ink);font-weight:700;text-decoration:none;font-size:1.05rem}
.stamp{padding:0 18px 16px;font-size:.8rem;color:var(--muted)}

/* Redes sociales */
.social{margin-top:22px;text-align:center}
.social-title{margin:0 0 10px;font-weight:700;color:var(--muted);font-size:.9rem}
.social-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.social-btn{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:700;text-decoration:none}
.social-btn svg{color:var(--muted)}
.social-row{align-items:center}
.social-icon{display:block;width:52px;height:52px;border-radius:50%;overflow:hidden;transition:transform .15s ease;box-shadow:0 0 0 1.5px var(--ring),0 2px 8px rgba(0,0,0,.12)}
.social-icon:active{transform:scale(.94)}
.social-icon img{width:100%;height:100%;object-fit:contain;display:block}
.social-row{gap:14px}
.icon-row{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.icon-prev{width:36px;height:36px;object-fit:contain;border-radius:8px;background:var(--surface-2);padding:3px}

/* Botón flotante de WhatsApp */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;gap:10px;
  min-height:58px;padding:0 20px 0 14px;border-radius:999px;background:var(--wa);color:var(--wa-ink);text-decoration:none;font-weight:700;
  box-shadow:0 6px 20px rgba(0,0,0,.22);transition:padding .2s ease,gap .2s ease}
.fab-icon{display:grid;place-items:center;width:32px;height:32px;flex:none}
.fab-label{white-space:nowrap;max-width:220px;overflow:hidden;transition:max-width .25s ease,opacity .2s ease}
.fab.compact{padding:0 13px;gap:0}
.fab.compact .fab-label{max-width:0;opacity:0}
.fab::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgba(37,211,102,.55);animation:fabpulse 2.4s ease-out infinite;pointer-events:none}
@keyframes fabpulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}70%{box-shadow:0 0 0 14px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
@media (prefers-reduced-motion: reduce){.fab::after{animation:none}}

/* Administración */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.tabs button{flex:none;min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.stack>*+*{margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px}
.card h3{margin:0 0 2px;font-size:1.02rem}
.card.hero{border:2px solid var(--accent)}
.card.hero .input{font-family:var(--display);font-size:1.6rem;font-weight:700;min-height:62px}
.eq{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:8px}
.eq>span{font-family:var(--display);font-weight:700;color:var(--muted);white-space:nowrap}
.eq .input{text-align:right;font-weight:700;font-size:1.15rem}
.rate-row{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center}
.rate-row .input{text-align:right;font-weight:600}
.hint{font-size:.83rem;color:var(--muted);margin-top:6px}
.err{font-size:.83rem;color:var(--danger);margin-top:6px;font-weight:600}
.input.bad{border-color:var(--danger)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.switch input{width:52px;height:30px;appearance:none;-webkit-appearance:none;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(22px)}
.radio-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.radio-group label{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface-2);font-weight:600}
.radio-group label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;margin-top:8px}
.step select{min-height:48px;font-size:.95rem}
.step .x{border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.formula{font-size:.9rem;background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;margin-top:10px}
.link-btn{background:none;border:0;color:var(--accent);font-weight:700;padding:10px 0;min-height:44px}
.hist-day{font-family:var(--display);font-weight:700;margin:18px 0 8px}
.hist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px 12px;margin-top:8px;font-size:.9rem}
.hist-grid span{color:var(--muted)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.savebar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.savebar .msg{flex:1;font-size:.88rem;color:var(--muted)}
.savebar .primary{margin:0;width:auto;padding:0 20px;min-height:50px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:200;max-width:90vw}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (min-width:700px){.wrap{padding-top:32px}}


/* ---------- Módulo de operaciones ---------- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--surface-2)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv strong{text-align:right}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;font-weight:700;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.timeline{position:relative;padding-left:20px}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-15px;top:6px;bottom:-10px;width:2px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-dot{position:absolute;left:-19px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.op-row{display:block;border-radius:var(--radius-lg);padding:14px}

/* Ver comprobante en grande */
.img-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;align-items:center;justify-content:center;padding:24px}
.img-overlay img{max-width:100%;max-height:100%;border-radius:10px;display:block}
.img-overlay-close{position:fixed;top:calc(16px + env(safe-area-inset-top));right:16px;width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.16);color:#fff;border:0;font-size:1.15rem}

/* Encabezado con menú a la izquierda */
.top.calc-top{flex-direction:column;align-items:stretch;gap:4px}
.top.calc-top .top-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.top.calc-top .brand{margin-top:6px}
/* Menú lateral */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(84vw,330px);background:var(--surface);z-index:61;padding:14px 14px 20px;
  display:flex;flex-direction:column;gap:6px;box-shadow:0 0 40px rgba(0,0,0,.4);animation:drawer-in .18s ease-out;overflow-y:auto}
@keyframes drawer-in{from{transform:translateX(-100%)}to{transform:none}}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 8px;font-family:var(--display);font-size:1.1rem}
.drawer-logo{height:52px;width:auto;max-width:190px;object-fit:contain}
.drawer-line{height:2px;background:var(--line);border-radius:2px;margin:0 2px 10px}
.drawer-item{min-height:64px;text-align:left;padding:0 22px;border-radius:999px;border:0;background:transparent;color:var(--ink);
  font-family:var(--display);font-weight:600;font-size:1.3rem;display:flex;align-items:center;gap:22px}
.drawer-item svg{flex:none}
.drawer-item.active{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.drawer-item:active{background:var(--accent-soft)}
.rate-top{margin-bottom:14px}
.rate-title{font-family:var(--display);font-size:1.35rem;margin:0;flex:1;text-align:center}
.rate-card{margin-bottom:14px}
.rate-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rate-label{font-weight:700;font-size:1.15rem;padding-top:4px}
.rate-val{text-align:right}
.rate-val strong{font-size:1.55rem;font-family:var(--display)}
.rate-delta{font-size:.95rem;font-weight:600;margin-top:2px}
.up{color:var(--accent)}.down{color:var(--danger)}.flat{color:var(--muted)}
.rate-tabs{display:flex;justify-content:space-between;gap:6px;margin-bottom:8px}
.rate-tabs button{flex:1;min-height:38px;border-radius:999px;border:0;background:transparent;font-weight:700;color:var(--muted)}
.rate-tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.chart-wrap{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart-wrap svg{width:100%;height:auto;display:block}
.chart-wrap svg *{pointer-events:none}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-txt{fill:var(--muted);font-size:11px}
.ch-line{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.ch-today{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 4;opacity:.7}
.ch-pill{fill:var(--ink)}
.ch-pill-txt{fill:var(--bg);font-size:12px;font-weight:700}
.ch-dot{fill:var(--surface);stroke-width:3}
.rate-date{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--muted);font-size:.95rem}
.rate-note{color:var(--muted);font-size:.85rem;margin:10px 4px 0}

/* Comprobante de la operación */
.rcp-overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.72);display:flex;align-items:stretch;justify-content:center}
.rcp-sheet{width:min(100%,520px);display:flex;flex-direction:column;background:var(--bg);padding:12px 12px 14px}
.rcp-body{flex:1;overflow-y:auto;border-radius:14px;background:#fff}
.rcp-body img{display:block;width:100%;height:auto}
.rcp-body .hint{padding:24px;color:#333}
.rcp-actions{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-top:10px}
.rcp-hint{text-align:center;margin:8px 0 0}
</style>
<style id="extra-style">/* Mejoras de experiencia del cliente: barra inferior, resumen, destinatarios, últimas operaciones */
#bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;gap:2px;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(0,0,0,.06)}
#nav-spacer{height:calc(78px + env(safe-area-inset-bottom))}
.nav-item{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:.72rem;font-weight:600;line-height:1.1;text-decoration:none;border-radius:12px;cursor:pointer}
.nav-item svg{width:24px;height:24px;display:block}
.nav-item.on{color:var(--accent)}
body:has(#bottom-nav) .fab{display:none}
.rv-total{display:flex;align-items:center;gap:12px}
.rv-total>div{flex:1}
.rv-ico{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800}
.rv-amount{font-size:1.35rem;color:var(--accent);white-space:nowrap}
.rv-recv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--ink);font-weight:600}
.rv-recv strong{font-size:1.1rem;white-space:nowrap}
.rv-toggle{align-self:center;color:var(--accent);font-weight:700}
.rv-eta{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--ink);font-weight:600;font-size:.92rem}
.rc-top{display:flex;align-items:center;gap:12px}
.rc-ico{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:1.3rem;flex:none}
.rc-main{flex:1;min-width:0}
.rc-main strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-star{border:0;background:transparent;font-size:1.7rem;line-height:1;color:var(--muted);min-width:44px;height:44px;cursor:pointer}
.rc-star.on{color:#F5B301}
.rc-row .grid2{margin-top:12px}
.recent-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.recent-row{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:0;border-top:1px solid var(--surface-2);background:transparent;padding:12px 0 2px;color:inherit;font-family:inherit;cursor:pointer}
.recent-ico{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;font-weight:800}
.recent-main{flex:1;min-width:0}
.recent-main strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-amt{text-align:right;font-weight:700;white-space:nowrap}
/* Logo del inicio más pequeño */
.top.has-logo .logo-img{width:min(138px,38vw)}
.top.has-logo{gap:2px;margin-bottom:10px}

.build-stamp{text-align:center;font-size:11px;opacity:.45;margin:6px 0 24px}

.apk-card{display:flex;align-items:center;gap:12px;margin:18px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.apk-ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.apk-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.3}
.apk-txt strong{font-size:14px}
.apk-txt span{opacity:.7}
.apk-btn{flex:none;padding:9px 14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;text-decoration:none}
</style>
</head>

<script id="app-core">/* =====================================================================
 * MOTOR DE CÁLCULO DE REMESAS
 * ---------------------------------------------------------------------
 * Todo lo que cambia con el negocio (monedas, países, tasas, fórmulas,
 * comisiones, redondeo) vive en DATOS (el objeto "state"), nunca aquí.
 * Este módulo solo sabe interpretar esos datos.
 *
 * FÓRMULAS: cada ruta es una lista de pasos que se aplican en orden
 * sobre el monto enviado:
 *     { op: "mul" | "div", rate: "CLAVE_DE_TASA", yields: "MONEDA" }
 *   - "mul" multiplica por la tasa, "div" divide entre la tasa.
 *   - "yields" (opcional) indica qué moneda resulta tras el paso; se usa
 *     para mostrar montos intermedios (ej. el equivalente en USD).
 * Para "Quiero recibir" se recorren los pasos al revés y con la
 * operación invertida, así cualquier fórmula nueva funciona en ambos
 * sentidos sin programar nada adicional.
 *
 * PRECISIÓN: se usa Decimal (decimal.js) con 40 dígitos. Solo se
 * redondea al mostrar.
 * ===================================================================== */
const Core = (function () {
  "use strict";
  const getD = () => {
    const D = (typeof Decimal !== "undefined") ? Decimal : null;
    if (!D) throw new Error("No se cargó la librería de cálculo decimal.");
    D.set({ precision: 40 });
    return D;
  };

  const SCHEMA_VERSION = 2;

  /* ---------- Datos por defecto (solo se usan la primera vez) ---------- */
  const DEFAULT_STATE = {
    schemaVersion: SCHEMA_VERSION,
    updatedAt: null,
    business: {
      name: "Remesas",
      logo: "",                           // imagen como data URI (se cambia en Administración → Negocio)
      // Enlaces de contacto (vacío = no se muestra). Solo se aceptan direcciones https://
      whatsapp: "",
      social: { instagram: "", tiktok: "", facebook: "" },
      socialIcons: { instagram: "", tiktok: "", facebook: "" },  // imágenes subidas por el administrador (data URI)
      footer: "⚠️ Tasa sujeta a cambios. Confirmar la tasa antes de realizar la operación."
    },
    // Monedas. Para agregar USDT/USD/Zelle en el futuro basta con sumar aquí.
    currencies: {
      BRL: { name: "Real brasileño", symbol: "R$", space: false },
      VES: { name: "Bolívar", symbol: "Bs", space: true },
      ARS: { name: "Peso argentino", symbol: "ARS", space: true },
      USD: { name: "Dólar (Zelle)", symbol: "USD", space: true },
      USDT: { name: "Tether", symbol: "USDT", space: true }
    },
    countries: [
      { id: "BR", name: "Brasil", flag: "🇧🇷", currency: "BRL" },
      { id: "VE", name: "Venezuela", flag: "🇻🇪", currency: "VES" },
      { id: "AR", name: "Argentina", flag: "🇦🇷", currency: "ARS" },
      // Métodos en dólares: se eligen como origen o destino igual que un país.
      { id: "ZL", name: "Zelle", flag: "💵", currency: "USD" },
      { id: "UT", name: "USDT", flag: "🪙", currency: "USDT" }
    ],
    // Tasas como texto para no perder precisión.
    // Formato único: 1 unidad de "base" = "value" unidades de "quote".
    // Ej. BRL_VES: 1 Real = 173 Bolívares.
    rates: {
      // source "app": en la APK se usa el BCV leído de bcv.org.ve (si es válido); "manual": siempre este valor.
      BCV_USD_VES: { label: "BCV actual", base: "USD", quote: "VES", value: "736.93", source: "app" },
      BRL_VES: { label: "Brasil → Venezuela", base: "BRL", quote: "VES", value: "173" },
      VES_BRL: { label: "Venezuela → Brasil", base: "VES", quote: "BRL", value: "0.004975124378109" },
      BRL_ARS: { label: "Brasil → Argentina", base: "BRL", quote: "ARS", value: "260" },
      ARS_BRL: { label: "Argentina → Brasil", base: "ARS", quote: "BRL", value: "0.002777777777778" },
      ARS_VES: { label: "Argentina → Venezuela", base: "ARS", quote: "VES", value: "0.55" },
      VES_ARS: { label: "Venezuela → Argentina", base: "VES", quote: "ARS", value: "1.820830298616169" },
      USD_BRL: { label: "Zelle → Brasil", base: "USD", quote: "BRL", value: "4.1" },
      USD_VES: { label: "Zelle → Venezuela", base: "USD", quote: "VES", value: "750" },
      VES_USD: { label: "Venezuela → Zelle", base: "VES", quote: "USD", value: "0.001333333333333" },
      USDT_VES: { label: "USDT → Venezuela", base: "USDT", quote: "VES", value: "947.27" },
      VES_USDT: { label: "Venezuela → USDT", base: "VES", quote: "USDT", value: "0.001055665227443" },
      BRL_USD: { label: "Brasil → Zelle", base: "BRL", quote: "USD", value: "0.163934426229508" },
      USDT_BRL: { label: "USDT → Brasil", base: "USDT", quote: "BRL", value: "5" },
      BRL_USDT: { label: "Brasil → USDT", base: "BRL", quote: "USDT", value: "0.188679245283018" }
    },
    // Rutas y sus fórmulas (editables desde Administración).
    // "reference": tasas que se muestran como referencia pero no entran en el cálculo.
    routes: [
      { id: "BR-VE", from: "BR", to: "VE", enabled: true, reference: ["BCV_USD_VES"], steps: [{ op: "mul", rate: "BRL_VES" }] },
      { id: "VE-BR", from: "VE", to: "BR", enabled: true, steps: [{ op: "mul", rate: "VES_BRL" }] },
      { id: "BR-AR", from: "BR", to: "AR", enabled: true, steps: [{ op: "mul", rate: "BRL_ARS" }] },
      { id: "AR-BR", from: "AR", to: "BR", enabled: true, steps: [{ op: "mul", rate: "ARS_BRL" }] },
      { id: "AR-VE", from: "AR", to: "VE", enabled: true, steps: [{ op: "mul", rate: "ARS_VES" }] },
      { id: "VE-AR", from: "VE", to: "AR", enabled: true, steps: [{ op: "mul", rate: "VES_ARS" }] },
      { id: "ZL-BR", from: "ZL", to: "BR", enabled: true, steps: [{ op: "mul", rate: "USD_BRL" }] },
      { id: "ZL-VE", from: "ZL", to: "VE", enabled: true, steps: [{ op: "mul", rate: "USD_VES" }] },
      { id: "VE-ZL", from: "VE", to: "ZL", enabled: true, steps: [{ op: "mul", rate: "VES_USD" }] },
      { id: "UT-VE", from: "UT", to: "VE", enabled: true, steps: [{ op: "mul", rate: "USDT_VES" }] },
      { id: "VE-UT", from: "VE", to: "UT", enabled: true, steps: [{ op: "mul", rate: "VES_USDT" }] },
      { id: "BR-ZL", from: "BR", to: "ZL", enabled: true, steps: [{ op: "mul", rate: "BRL_USD" }] },
      { id: "UT-BR", from: "UT", to: "BR", enabled: true, steps: [{ op: "mul", rate: "USDT_BRL" }] },
      { id: "BR-UT", from: "BR", to: "UT", enabled: true, steps: [{ op: "mul", rate: "BRL_USDT" }] }
    ],
    // Comisión en la moneda de origen.
    //   mode "included": solo se muestra (no suma al total ni cambia lo que se recibe).
    //   mode "added":    se suma al monto enviado (total = monto + comisión).
    fees: {
      enabled: false,
      mode: "included",                   // "included" | "added"
      type: "none",                       // "none" | "fixed" | "percent"
      percent: "0",
      fixed: { BRL: "0", VES: "0", ARS: "0", USD: "0", USDT: "0" },
      // Monto mínimo de envío: por debajo de esto se avisa al cliente y, si la comisión
      // es porcentual, se cobra "lowAmountPercent" en vez del porcentaje normal.
      minSendUsd: "10",       // mínimo general (VES, ARS), convertido a la moneda de cada país
      minBRL: "30",           // Brasil tiene su propio mínimo fijo en reales
      minZelleUsd: "20",      // Zelle tiene su propio mínimo fijo en USD
      minUsdtUnits: "5",      // USDT tiene su propio mínimo fijo en USDT
      minVeToBrUsd: "5",      // Venezuela → Brasil tiene su propio mínimo (equivalente en USD BCV), distinto del resto de Venezuela
      lowAmountPercent: "8.5" // comisión aplicada si el monto está por debajo del mínimo
    },
    // Redondeo solo para lo que se muestra.
    rounding: { decimals: 2, mode: "half-up" }, // "half-up" | "down" | "up"
    history: []
  };

  const clone = (o) => JSON.parse(JSON.stringify(o));

  /** Completa datos guardados con claves nuevas de DEFAULT_STATE (migraciones). */
  function migrate(saved) {
    const base = clone(DEFAULT_STATE);
    if (!saved || typeof saved !== "object") return base;
    const s = clone(saved);
    if (!s.schemaVersion || s.schemaVersion < 2) {
      // Esquema 1 usaba tasas con significados mixtos (divisores). Se adopta el formato
      // "1 origen = X destino"; el historial viejo se conserva marcado como formato anterior.
      s.rates = clone(base.rates); s.routes = clone(base.routes);
      (s.history || []).forEach((h) => { if (!h.schema) h.schema = 1; });
    }
    for (const k of Object.keys(base)) if (s[k] === undefined) s[k] = base[k];
    for (const k of Object.keys(base.currencies)) if (!s.currencies[k]) s.currencies[k] = base.currencies[k];
    for (const k of Object.keys(base.rates)) if (!s.rates[k]) s.rates[k] = base.rates[k];
    for (const c of base.countries) if (!s.countries.find((x) => x.id === c.id)) s.countries.push(c);
    for (const r of base.routes) if (!s.routes.find((x) => x.id === r.id)) s.routes.push(r);
    s.fees = Object.assign(clone(base.fees), s.fees);
    s.fees.fixed = Object.assign(clone(base.fees.fixed), s.fees.fixed);
    s.rounding = Object.assign(clone(base.rounding), s.rounding);
    s.business = Object.assign(clone(base.business), s.business);
    s.business.social = Object.assign(clone(base.business.social), s.business.social || {});
    s.business.socialIcons = Object.assign(clone(base.business.socialIcons), s.business.socialIcons || {});
    if (!Array.isArray(s.history)) s.history = [];
    s.schemaVersion = SCHEMA_VERSION;
    return s;
  }

  /* ---------- Parseo de números escritos por personas ---------- */
  /** Acepta "1.234,56", "1234,56", "1234.56", "500", "1.234" (miles). Devuelve string decimal o null. */
  function parseNumber(input) {
    if (input === null || input === undefined) return null;
    let s = String(input).trim().replace(/\s|R\$|Bs\.?|ARS|USD/gi, "");
    if (!s) return null;
    if (!/^-?[\d.,]+$/.test(s)) return null;
    if (s.includes(",")) {
      if ((s.match(/,/g) || []).length > 1) return null;
      const [ent, dec] = s.split(",");
      if (ent.includes(".") && !/^-?\d{1,3}(\.\d{3})+$/.test(ent)) return null;
      s = ent.replace(/\./g, "") + "." + dec;
    } else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) {
      s = s.replace(/\./g, "");            // 1.234 / 1.234.567 = separador de miles
    } else if ((s.match(/\./g) || []).length > 1) {
      return null;
    }
    if (s.endsWith(".")) s = s.slice(0, -1);
    if (!/^-?\d*\.?\d+$/.test(s)) return null;
    return getD()(s).toString();
  }

  /* ---------- Redondeo y formato ---------- */
  function round(value, decimals, mode) {
    const D = getD();
    const rm = mode === "down" ? D.ROUND_DOWN : mode === "up" ? D.ROUND_UP : D.ROUND_HALF_UP;
    return new D(value).toDecimalPlaces(decimals, rm);
  }

  /** Formato 1.234,56 (miles con punto, decimales con coma). */
  function formatNumber(value, decimals) {
    const D = getD();
    const fixed = new D(value).toFixed(decimals, D.ROUND_HALF_UP);
    const neg = fixed.startsWith("-");
    const [ent, dec] = fixed.replace("-", "").split(".");
    const grouped = ent.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (neg ? "-" : "") + grouped + (dec ? "," + dec : "");
  }

  /** Tasas: mínimo 2 decimales, hasta 15, sin ceros sobrantes. */
  function formatRate(value) {
    const D = getD();
    const d = new D(value);
    const dp = Math.min(Math.max(d.decimalPlaces(), 2), 15);
    return formatNumber(d, dp);
  }

  /** "R$1 = Bs 173,00" usando base/quote de la tasa. */
  function rateText(state, rate) {
    const sym = (c) => { const x = state.currencies[c]; return x ? x.symbol + (x.space ? " " : "") : (c ? c + " " : ""); };
    if (!rate.base || !rate.quote) return formatRate(rate.value);
    return `${sym(rate.base)}1 = ${sym(rate.quote)}${formatRate(rate.value)}`;
  }

  function formatMoney(state, currency, value, decimals) {
    const c = state.currencies[currency] || { symbol: currency, space: true };
    const dec = decimals === undefined ? state.rounding.decimals : decimals;
    return c.symbol + (c.space ? " " : "") + formatNumber(value, dec);
  }

  const COUNTRY_NAME_EN = { BR: "Brazil" }; // el resto se escribe igual en los 3 idiomas
  function t(key, lang, vars) {
    const row = T[key];
    let s = (row && (row[lang] || row.es)) || key;
    if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
    return s;
  }
  function countryNameFor(id, name, lang) { return lang === "en" && COUNTRY_NAME_EN[id] ? COUNTRY_NAME_EN[id] : name; }


  const country = (state, id) => state.countries.find((c) => c.id === id);
  const findRoute = (state, from, to) => state.routes.find((r) => r.from === from && r.to === to);

  /** Verifica que una ruta se pueda calcular; devuelve lista de errores. */
  function validateRoute(state, route) {
    const errs = [];
    if (!route) return ["Esta ruta no está configurada."];
    if (!route.enabled) errs.push("Esta ruta está desactivada por el momento.");
    if (!Array.isArray(route.steps) || route.steps.length === 0) errs.push("La ruta no tiene fórmula.");
    for (const st of route.steps || []) {
      const r = state.rates[st.rate];
      if (!r) { errs.push(`La fórmula usa una tasa inexistente (${st.rate}).`); continue; }
      if (st.op !== "mul" && st.op !== "div") errs.push(`Operación inválida en la fórmula (${st.op}).`);
      let ok = false;
      try { ok = getD()(r.value).gt(0); } catch (e) { ok = false; }
      if (!ok) errs.push(`La tasa "${r.label}" no tiene un valor válido.`);
    }
    return errs;
  }

  /** Aplica la fórmula. inverse=true la recorre al revés (Quiero recibir). */
  function applySteps(state, route, amount, inverse) {
    const D = getD();
    let x = new D(amount);
    const trace = [];
    const steps = inverse
      ? route.steps.slice().reverse().map((s) => ({ ...s, op: s.op === "mul" ? "div" : "mul" }))
      : route.steps;
    steps.forEach((s, i) => {
      const r = new D(state.rates[s.rate].value);
      x = s.op === "mul" ? x.times(r) : x.div(r);
      // En sentido directo, "yields" describe el resultado de este paso.
      if (!inverse && s.yields && i < steps.length - 1) trace.push({ currency: s.yields, value: x });
    });
    return { value: x, trace };
  }

  /** Comisión sobre el monto enviado (moneda de origen). percentOverride reemplaza f.percent si se indica (monto bajo el mínimo). */
  function computeFee(state, currency, sendAmount, percentOverride) {
    const D = getD();
    const f = state.fees;
    if (!f.enabled || f.type === "none") return new D(0);
    if (f.type === "percent") return new D(sendAmount).times(new D(percentOverride !== undefined ? percentOverride : (f.percent || 0))).div(100);
    if (f.type === "fixed") return new D((f.fixed && f.fixed[currency]) || 0);
    return new D(0);
  }

  /**
   * Monto mínimo de envío para un país de origen, en su propia moneda.
   * Zelle y USDT tienen su propio mínimo fijo; el resto se calcula como el
   * equivalente de "minSendUsd" dólares, usando las tasas ya configuradas.
   * Devuelve null si no hay forma de calcularlo (falta alguna tasa).
   */
  function minSendFor(state, fromId, toId, currency) {
    const D = getD();
    try {
      if (fromId === "VE" && (toId === "BR" || toId === "AR")) {
        const bcv = state.rates.BCV_USD_VES; if (!bcv) return null;
        return new D(state.fees.minVeToBrUsd || "5").times(bcv.value); // Venezuela → Brasil/Argentina: su propio mínimo, no el general de Venezuela
      }
      if (fromId === "ZL") return new D(state.fees.minZelleUsd || "20");
      if (fromId === "UT") return new D(state.fees.minUsdtUnits || "5");
      if (currency === "BRL") return new D(state.fees.minBRL || "30");
      const usdMin = new D(state.fees.minSendUsd || "10");
      if (currency === "VES") {
        const bcv = state.rates.BCV_USD_VES; if (!bcv) return null;
        return usdMin.times(bcv.value); // 1 USD = bcv VES
      }
      if (currency === "ARS") {
        const a2b = state.rates.ARS_BRL, b2u = state.rates.BRL_USD; // 1 ARS = a2b BRL; 1 BRL = b2u USD
        if (!a2b || !b2u) return null;
        return usdMin.div(new D(a2b.value).times(b2u.value));
      }
      return null;
    } catch (e) { return null; }
  }

  /**
   * Cotización completa.
   * mode: "send" (el monto es lo que se envía) | "receive" (lo que se quiere recibir).
   * Devuelve valores exactos y valores redondeados para mostrar.
   */
  function quote(state, { from, to, mode, amount }) {
    const D = getD();
    if (!from || !to) throw new Error("Selecciona el país de origen y de destino.");
    if (from === to) throw new Error("El origen y el destino deben ser países distintos.");
    const route = findRoute(state, from, to);
    const errs = validateRoute(state, route);
    if (errs.length) throw new Error(errs[0]);
    const amt = parseNumber(amount);
    if (amt === null) throw new Error("Escribe un monto válido, por ejemplo 500 o 1.234,56.");
    if (!new D(amt).gt(0)) throw new Error("El monto debe ser mayor que cero.");

    const fromC = country(state, from), toC = country(state, to);
    let send, receive, trace;
    if (mode === "receive") {
      receive = new D(amt);
      send = applySteps(state, route, receive, true).value;
      trace = applySteps(state, route, send, false).trace;
    } else {
      send = new D(amt);
      const r = applySteps(state, route, send, false);
      receive = r.value; trace = r.trace;
    }
    const { decimals, mode: rm } = state.rounding;
    const minReqRaw = minSendFor(state, fromC.id, toC.id, fromC.currency);
    const minReq = minReqRaw ? round(minReqRaw, decimals, rm) : null; // redondeado ANTES de comparar, para que un monto "justo en el mínimo" no quede adentro por un resto de precisión invisible
    const lowAmount = !!(minReq && send.lt(minReq));
    const percentApplies = state.fees.enabled && state.fees.type === "percent";
    const appliedPercent = lowAmount && percentApplies ? (state.fees.lowAmountPercent || state.fees.percent) : state.fees.percent;
    /**
     * La comisión normal ya vive "escondida" dentro de la tasa (modo "incluida"): no se
     * descuenta nada, solo se muestra. Pero el RECARGO por monto bajo el mínimo (la
     * diferencia entre 8,5% y 5,5%, por ejemplo) sí debe restarse de verdad, o el cliente
     * vería el mismo monto de siempre pese al aviso. Solo aplica en modo "incluida":
     * en modo "se suma al total", subir el porcentaje ya sube el total a pagar por su cuenta.
     * Se hace ANTES de calcular la comisión mostrada, para que ese número siga cuadrando
     * con el monto final enviado/recibido.
     */
    if (lowAmount && percentApplies && state.fees.mode !== "added") {
      const extra = new D(appliedPercent).minus(state.fees.percent || 0).div(100);
      if (extra.gt(0)) {
        if (mode === "receive") send = send.div(new D(1).minus(extra)); // debe enviar más para igual recibir lo pedido
        else receive = receive.times(new D(1).minus(extra)); // envía lo mismo, recibe menos
      }
    }
    const fee = computeFee(state, fromC.currency, send, lowAmount && percentApplies ? appliedPercent : undefined);
    const sendR = round(send, decimals, rm);
    const receiveR = round(receive, decimals, rm);
    const feeR = round(fee, decimals, rm);
    // El total se arma con los montos ya redondeados para que el recibo cuadre a la vista.
    const feeIncluded = state.fees.mode !== "added";
    const totalR = feeIncluded ? sendR : sendR.plus(feeR);

    const ratesUsed = [];
    for (const s of route.steps) {
      if (!ratesUsed.find((x) => x.key === s.rate)) {
        const r = state.rates[s.rate];
        ratesUsed.push({ key: s.rate, reference: false, label: s.rate === "BCV_USD_VES" ? "BCV" : "Tasa", fullLabel: r.label, value: r.value, text: rateText(state, r) });
      }
    }
    for (const k of route.reference || []) {
      const r = state.rates[k];
      if (r && !ratesUsed.find((x) => x.key === k)) ratesUsed.push({ key: k, reference: true, label: k === "BCV_USD_VES" ? "BCV" : r.label, fullLabel: r.label, value: r.value, text: rateText(state, r) });
    }
    // Equivalente en dólares BCV del monto en bolívares (el que se recibe, o el que se envía si sale de Venezuela).
    let bcvUsd = null;
    try {
      const bcvR = state.rates.BCV_USD_VES;
      if (bcvR && new D(bcvR.value).gt(0)) {
        if (toC.currency === "VES") bcvUsd = { side: "receive", ves: receiveR, usd: round(receive.div(bcvR.value), 2, "half-up") };
        else if (fromC.currency === "VES") bcvUsd = { side: "send", ves: sendR, usd: round(send.div(bcvR.value), 2, "half-up") };
      }
    } catch (e) { bcvUsd = null; }
    return {
      bcvUsd,
      route, mode, from: fromC, to: toC,
      fromCurrency: fromC.currency, toCurrency: toC.currency,
      exact: { send, receive, fee, total: feeIncluded ? send : send.plus(fee) },
      feeIncluded,
      shown: { send: sendR, receive: receiveR, fee: feeR, total: totalR },
      hasFee: fee.gt(0),
      lowAmount, minRequired: minReq, appliedPercent,
      ratesUsed,
      intermediates: trace.map((t) => ({ currency: t.currency, value: round(t.value, 2, "half-up") }))
    };
  }

  const formatBcvUsd = (usd) => "US$ " + formatNumber(usd, 2);

  /* ---------- Mensaje de WhatsApp ---------- */
  /** opts.showFee: solo para uso interno; el mensaje que se comparte con el cliente no lleva el detalle de la comisión. */
  function whatsappText(state, q, lang, opts) {
    lang = lang || "es";
    const L = [];
    L.push(`${q.from.flag} ${countryNameFor(q.from.id, q.from.name, lang).toUpperCase()} → ${q.to.flag} ${countryNameFor(q.to.id, q.to.name, lang).toUpperCase()}`);
    L.push("");
    L.push(`💰 ${t("wa_amount_sent", lang)}: ${formatMoney(state, q.fromCurrency, q.shown.send)}`);
    for (const r of q.ratesUsed) {
      L.push(r.key === "BCV_USD_VES" ? `🏦 ${t("wa_bcv", lang)}: ${formatRate(r.value)}` : `💱 ${t("wa_rate", lang)}: ${r.text}`);
    }
    if (q.hasFee && opts && opts.showFee) {
      const pct = state.fees.type === "percent" ? ` (${formatRate(q.appliedPercent !== undefined ? q.appliedPercent : state.fees.percent)}%)` : "";
      L.push(`🧾 ${t("wa_commission", lang)}${pct}${q.feeIncluded ? " " + t("wa_included", lang) : ""}: ${formatMoney(state, q.fromCurrency, q.shown.fee)}`);
      L.push(`💳 ${t("wa_total_to_pay", lang)}: ${formatMoney(state, q.fromCurrency, q.shown.total)}`);
    }
    if (q.hasFee && !q.feeIncluded && !(opts && opts.showFee)) L.push(`💳 ${t("wa_total_to_pay", lang)}: ${formatMoney(state, q.fromCurrency, q.shown.total)}`);
    L.push(`💵 ${t("wa_receives", lang)}: ${formatMoney(state, q.toCurrency, q.shown.receive)}`);
    if (q.bcvUsd) L.push(`🏦 ${t("wa_bcv_usd", lang)}: ${formatBcvUsd(q.bcvUsd.usd)}`);
    L.push("");
    if (state.business.footer) L.push(state.business.footer);
    if (state.business.name) L.push(`— ${state.business.name}`);
    return L.join("\n");
  }
  const whatsappUrl = (text) => "https://wa.me/?text=" + encodeURIComponent(text);

  /* ---------- Historial ---------- */
  const HISTORY_LIMIT = 3000;
  function snapshotEntry(state, at) {
    const rates = {};
    for (const [k, r] of Object.entries(state.rates)) rates[k] = r.value;
    return { at, rates, fees: clone(state.fees) };
  }
  function pushHistory(state, at) {
    state.history.unshift(snapshotEntry(state, at));
    if (state.history.length > HISTORY_LIMIT) state.history.length = HISTORY_LIMIT;
  }

  /* ---------- Fuente del BCV (preparado para API futura) ----------
   * Hoy solo existe "manual". Para una API: agregar un proveedor con
   * fetchRate() que devuelva el valor como texto (ej. "736.93").
   * Nota: una página publicada no puede consultar sitios externos por
   * sí sola; la API se conectaría desde un servicio intermedio.
   */
  const BCV_PROVIDERS = {
    manual: { name: "Manual", fetchRate: null },
    // La APK lee bcv.org.ve y lo expone como window.RemesasApp.getBcv() → '{"value":"848.5458","date":"2026-09-18"}'
    app: { name: "App Android (bcv.org.ve)", fetchRate: null }
  };

  /** Acepta un BCV leído en vivo solo si es positivo y no se aleja más de 50% del valor guardado. */
  function validLiveBcv(saved, live) {
    try {
      const D = getD(), v = new D(live), s = new D(saved);
      if (!v.isFinite() || !v.gt(0)) return false;
      if (s.gt(0) && (v.lt(s.times(0.5)) || v.gt(s.times(2)))) return false;
      return true;
    } catch (e) { return false; }
  }

  /* ---------- Documento publicado ----------
   * La página se regenera completa al guardar: mismo estilo y código,
   * con los datos nuevos incrustados. Se usa tanto al compilar como
   * desde el panel de administración.
   */
  function buildDocument(parts, state) {
    const S = "<" + "script", E = "<\/" + "script>";
    const json = JSON.stringify(state).replace(/</g, "\\u003c");
    return [
      "<!doctype html>",
      '<html lang="es">',
      "<head>",
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">',
      "<title>Calculadora de remesas</title>",
      '<link rel="preconnect" href="https://fonts.googleapis.com">',
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;600;700&display=swap">',
      (parts.headExtra || ""),
      (parts.cdnScripts || []).map((u) => S + ' src="' + u + '"><\/script>').join("\n"),
      '<style id="app-style">' + parts.css + "</style>",
      "</head>",
      "<body>",
      '<div id="app" class="wrap"></div>',
      S + ' id="lib-decimal">' + parts.decimalJs + E,
      S + ' id="app-core">' + parts.coreJs + E,
      (parts.config ? S + ' type="application/json" id="app-config">' + JSON.stringify(parts.config).replace(/</g, "\\u003c") + E : ""),
      S + ' type="application/json" id="app-state">' + json + E,
      S + ' id="app-main">' + parts.mainJs + E,
      (parts.opsJs ? S + ' id="app-ops">' + parts.opsJs + E : ""),
      "</body>",
      "</html>"
    ].filter((x) => x !== "").join("\n");
  }

  /** Solo enlaces https:// bien formados (evita enlaces peligrosos). */
  function safeUrl(u) {
    try { const x = new URL(String(u || "").trim()); return x.protocol === "https:" ? x.href : ""; }
    catch (e) { return ""; }
  }

  return {
    safeUrl, buildDocument, DEFAULT_STATE, SCHEMA_VERSION, migrate, clone, parseNumber, round,
    formatNumber, formatRate, formatMoney, formatBcvUsd, rateText, country, findRoute, validateRoute,
    applySteps, computeFee, quote, whatsappText, whatsappUrl, pushHistory,
    snapshotEntry, BCV_PROVIDERS, validLiveBcv, t, countryNameFor
  };
})();
if (typeof module !== "undefined") module.exports = Core;
</script>

   * Las tasas viven en data.json dentro del repositorio. Los clientes lo leen
   * (sin llave). El administrador guarda con su llave de GitHub, que queda solo
   * en su dispositivo.
   */
  const GitHub = CONFIG.github ? (function (G) {
    const base = `https://api.github.com/repos/${G.owner}/${G.repo}`;
    const fileApi = `${base}/contents/${G.path}`;
    let sha = null;
    const getToken = () => store.get("ghtoken") || "";
    const hdr = (tok) => { const h = { Accept: "application/vnd.github+json" }; if (tok) h.Authorization = "Bearer " + tok; return h; };
    const dec = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), (c) => c.charCodeAt(0)));
    const enc = (str) => { const by = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(bin); };
    async function load() {
      try {
        const r = await fetch(`${fileApi}?ref=${G.branch}&t=${Date.now()}`, { headers: hdr(getToken()), cache: "no-store" });
        if (r.ok) { const j = await r.json(); sha = j.sha; if (j.content) return JSON.parse(dec(j.content)); }
      } catch (e) { /* se intenta la copia publicada */ }
      try { const r = await fetch(`${G.path}?t=${Date.now()}`, { cache: "no-store" }); if (r.ok) return await r.json(); } catch (e) { }
      return null;
    }
    async function verify(tok) {
      try { const r = await fetch(base, { headers: hdr(tok), cache: "no-store" }); if (!r.ok) return false;
        const j = await r.json(); return !!(j.permissions && j.permissions.push); } catch (e) { return false; }
    }
    async function save(state) {
      const tok = getToken(); if (!tok) throw { code: "not_writer" };
      if (!sha) await load();
      const body = { message: "Actualizar tasas " + new Date().toISOString(), content: enc(JSON.stringify(state)), branch: G.branch };
      if (sha) body.sha = sha;
      const r = await fetch(fileApi, { method: "PUT", headers: Object.assign(hdr(tok), { "Content-Type": "application/json" }), body: JSON.stringify(body) });
      if (r.status === 409 || r.status === 422) { await load(); throw { code: "conflict" }; }
      if (r.status === 401 || r.status === 403 || r.status === 404) throw { code: "not_writer" };
      if (!r.ok) throw { code: "error" };
      const j = await r.json(); sha = j.content && j.content.sha;
    }
    return { load, verify, save, getToken, setToken: (t) => store.set("ghtoken", t), clearToken: () => store.set("ghtoken", null) };
  })(CONFIG.github) : null;

  const $ = (sel, root) => (root || document).querySelector(sel);

  const fmtTime = (iso) => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

  /* ---------- BCV en vivo (solo dentro de la app Android) ---------- */

  const shortDate = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); return m ? `${m[3]}/${m[2]}/${m[1]}` : ""; };

  /* =================== CALCULADORA =================== */

  function renderSavebar() {
    const bar = $("#savebar"); if (!bar) return;

  /** Campo numérico que escribe en el borrador. */
  function numberInput(id, value, onValid, opts) {
    opts = opts || {};
    return { html: `<input class="input" id="${id}" inputmode="decimal" autocomplete="off" value="${esc(toInput(value))}"${opts.aria ? ` aria-label="${esc(opts.aria)}"` : ""}>`,
      bind() {
        const el = document.getElementById(id); if (!el) return;
        const errEl = document.getElementById(id + "-err");
        el.oninput = () => {
          const v = C.parseNumber(el.value);
          const ok = v !== null && (opts.allowZero ? Number(v) >= 0 : Number(v) > 0) && (opts.max === undefined || Number(v) <= opts.max);
          el.classList.toggle("bad", !ok);
          if (errEl) errEl.textContent = ok ? "" : (opts.msg || "Escribe un número mayor que cero.");
          if (ok) onValid(v);
          markDirtyRaw(ok, id);
        };
      } };
  }
  const invalidFields = new Set();
  function markDirtyRaw(ok, id) { if (ok) invalidFields.delete(id); else invalidFields.add(id); ui.dirty = true; refreshPreviews(); renderSavebar(); }

  function validateDraft() {
    const d = ui.draft; if (!d) return [];
    if (invalidFields.size) return ["Corrige los campos marcados en rojo."];
    for (const r of d.routes) {
      const e = C.validateRoute(d, r).filter((x) => !x.includes("desactivada"));
      if (e.length) return [`${r.from} → ${r.to}: ${e[0]}`];
    }
    return [];
  }

  function example(route, amount) {
    try {
      const q = C.quote(ui.draft, { from: route.from, to: route.to, mode: "send", amount: String(amount) });
      return `Ejemplo: ${C.formatMoney(ui.draft, q.fromCurrency, q.shown.send)} → ${C.formatMoney(ui.draft, q.toCurrency, q.shown.receive)}`;
    } catch (e) { return e.message; }
  }
  const EX_AMOUNT = { BRL: 500, VES: 20100, ARS: 100000, USD: 100, USDT: 100 };
  function refreshPreviews() {
    $$("[data-preview]").forEach((el) => {
      const r = ui.draft.routes.find((x) => x.id === el.dataset.preview);
      if (r) el.textContent = example(r, EX_AMOUNT[C.country(ui.draft, r.from).currency] || 100);
    });

    $$("[data-inverse]").forEach((el) => (el.textContent = inverseText(ui.draft, el.dataset.inverse)));

  /* ----- Pestaña: Tasas ----- */
  const sym = (d, c) => (d.currencies[c] || { symbol: c || "" }).symbol;
  /** Muestra el inverso para comprobar tasas con muchos decimales (ej. 0,004975… = Bs 201 por R$1). */
  function inverseText(d, key) {
    const r = d.rates[key];
    try {
      const inv = new Decimal(1).div(r.value);
      const dp = inv.gte(1) ? 2 : Math.min(Math.max(-Math.floor(Math.log10(Number(inv))) + 3, 2), 12);
      return `Equivale a ${sym(d, r.quote)}${(d.currencies[r.quote] || {}).space ? " " : ""}1 = ${sym(d, r.base)}${(d.currencies[r.base] || {}).space ? " " : ""}${C.formatNumber(inv, dp)}`;
    } catch (e) { return ""; }
  }

      return `<div class="eq"><span>${esc(sym(d, r.base))} 1 =</span>${inp.html}<span>${esc(sym(d, r.quote))}</span></div>`; };
    const bcvIn = numberInput("r-BCV_USD_VES", d.rates.BCV_USD_VES.value, (v) => (d.rates.BCV_USD_VES.value = v), { aria: "BCV actual" });

        ${routesUsing("BCV_USD_VES").map((r) => `<div class="hint" data-preview="${r.id}"></div>`).join("")}

    html += `<div class="card"><h3>Agregar tasa nueva</h3><div class="hint" style="margin-bottom:10px">Para USDT, USD, Zelle u otras rutas. Luego úsala en Fórmulas.</div>

  /** Lee una imagen del teléfono, la reduce a maxW píxeles y la devuelve como data URI. */
  function loadImage(file, maxW, type, done) {
    if (!/^image\//.test(file.type)) return done(null, "Elige un archivo de imagen.");
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(img.width * scale)); cv.height = Math.max(1, Math.round(img.height * scale));
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        const data = cv.toDataURL(type);
        if (data.length > 300000) return done(null, "La imagen es demasiado pesada.");
        done(data);
      };
      img.onerror = () => done(null, "No se pudo leer la imagen.");
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

      };

    };

  /* ---------- Guardar (vuelve a publicar la página con los datos nuevos) ---------- */
  async function save() {
    if ((!ui.artifact && !GitHub) || ui.saving) return;
    const errs = validateDraft(); if (errs.length) return toast(errs[0]);
    const next = C.clone(ui.draft);
    // Protección contra errores de tipeo (como guardar "8" en vez de "849"): si el BCV cambia
    // de forma muy brusca, se pide confirmar antes de guardar.
    const oldBcv = STATE.rates.BCV_USD_VES && STATE.rates.BCV_USD_VES.value;
    const newBcv = next.rates.BCV_USD_VES && next.rates.BCV_USD_VES.value;
    if (oldBcv && newBcv && oldBcv !== newBcv) {
      const ratio = Number(newBcv) / Number(oldBcv);
      if (isFinite(ratio) && (ratio < 0.5 || ratio > 2)) {
        const ok = confirm(`El BCV va a cambiar de ${C.formatRate(oldBcv)} a ${C.formatRate(newBcv)}, un cambio muy grande. ¿Seguro que quieres guardarlo así?`);
        if (!ok) return;
      }
    }
    const now = new Date().toISOString();
    const ratesChanged = Object.keys(next.rates).some((k) => !STATE.rates[k] || STATE.rates[k].value !== next.rates[k].value)
      || JSON.stringify(next.fees) !== JSON.stringify(STATE.fees);
    next.updatedAt = now;
    if (ratesChanged) C.pushHistory(next, now);
    ui.saving = true; renderSavebar();
    if (GitHub) {
      try {
        await GitHub.save(next);
        STATE = C.migrate(next); ui.draft = C.clone(STATE); ui.dirty = false; ui.saving = false;
        renderAdmin(); toast("Cambios guardados ✓");
      } catch (e) {
        ui.saving = false;
        const code = e && e.code;
        toast(code === "conflict" ? "Se guardó otro cambio al mismo tiempo. Toca Guardar otra vez."
          : code === "not_writer" ? "Tu llave de GitHub no es válida o venció. Sal y vuelve a entrar con una nueva."
          : "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.");
        renderSavebar();
      }
      return;
    }
    session.set("reopen", ui.tab);
    try {
      await ui.artifact.publish(C.buildDocument(PARTS, next));
      // La página se recarga sola con la versión nueva.
    } catch (e) {
      ui.saving = false; session.take("reopen");
      const code = e && e.code;
      toast(code === "conflict" ? "Otra sesión guardó al mismo tiempo. La página se actualizará; revisa y vuelve a guardar."
        : code === "not_writer" || code === "not_granted" ? "Tu cuenta no tiene permiso para guardar cambios."
        : "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.");
      renderSavebar();
    }
  }

  /* =================== TASAS: MENÚ Y GRÁFICAS =================== */
  var RATE_KINDS = {
    bcv:  { titleKey: "rate_bcv",  labelKey: "rate_label_usd",  series: "usd",  dec: 4, color: "var(--accent)", src: "rate_source_bcv",  icon: "💵" },
    usdt: { titleKey: "rate_usdt", labelKey: "rate_label_usdt", series: "usdt", dec: 2, color: "#E0A100",       src: "rate_source_usdt", icon: "🪙" },
    eur:  { titleKey: "rate_eur",  labelKey: "rate_label_eur",  series: "eur",  dec: 4, color: "#4C8DFF",       src: "rate_source_bcv",  icon: "💶" }
  };
  var RATE_RANGES = [["7", "7D"], ["30", "1M"], ["90", "3M"], ["180", "6M"], ["365", "1Y"]];
  var tasasCache = null;

  function veToday() { return new Date(Date.now() - 4 * 3600 * 1000).toISOString().slice(0, 10); } // Venezuela: UTC-4, sin horario de verano
  function dayShift(iso, n) { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function fmtNum(n, dec) {
    const s = Math.abs(n).toFixed(dec), parts = s.split(".");
    return (n < 0 && Number(s) !== 0 ? "-" : "") + parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (parts[1] ? "," + parts[1] : "");
  }
  function fmtPct(p) { const s = Math.abs(p).toFixed(2).replace(/0+$/, "").replace(/\.$/, ""); return (p < 0 && Number(s) !== 0 ? "-" : "") + s.replace(".", ","); }
  function fmtDay(iso) { return iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(2, 4); }

  var MENU_ICONS = {
    calc: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.5"/><rect x="7" y="6" width="10" height="4" rx="1"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>',
    bcv: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6"/><path d="M5.5 10v8M9.8 10v8M14.2 10v8M18.5 10v8M3 20.5h18"/></svg>',
    usdt: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 4.5h13M12 4.5v15"/><ellipse cx="12" cy="11" rx="8.5" ry="2.4"/></svg>',
    eur: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.6 8.8a4.2 4.2 0 1 0 0 6.4M7.6 10.9h6M7.6 13.1h6"/></svg>'
  };
  /** Menú lateral: Calculadora + las 3 pantallas de tasas. Se abre desde la calculadora y desde las tasas. */
  function openMenu() {
    if (document.getElementById("menu-root")) return;
    const current = ui.view === "rates" ? ui.rateKind : "calc";
    const items = [["calc", tt("menu_calc")]].concat(["bcv", "usdt", "eur"].map((k) => [k, tt(RATE_KINDS[k].titleKey)]));
    const logo = STATE.business.logo && /^data:image\//.test(STATE.business.logo) ? STATE.business.logo : "";
    const root = document.createElement("div"); root.id = "menu-root";
    root.innerHTML = `<div class="drawer-backdrop" id="menu-bd"></div>
      <nav class="drawer" role="dialog" aria-label="${esc(tt("menu_title"))}">
        <div class="drawer-head">${logo ? `<img src="${esc(logo)}" alt="" class="drawer-logo">` : `<strong>${esc(STATE.business.name || tt("menu_title"))}</strong>`}
          <button class="icon-btn" id="menu-close" aria-label="${esc(tt("menu_close"))}">✕</button></div>
        <div class="drawer-line"></div>
        ${items.map((it) => `<button class="drawer-item${it[0] === current ? " active" : ""}" data-kind="${it[0]}" ${it[0] === current ? 'aria-current="page"' : ""}>${MENU_ICONS[it[0]]}<span>${esc(it[1])}</span></button>`).join("")}
      </nav>`;

    Array.prototype.forEach.call(root.querySelectorAll(".drawer-item"), (btn) => (btn.onclick = () => {

      if (k === "calc") { if (ui.view === "rates") leaveRates(); }

  function loadTasas() {
    if (tasasCache && Date.now() - tasasCache.at < 5 * 60 * 1000) return Promise.resolve(tasasCache.data);
    return fetch("./tasas.json?t=" + Date.now(), { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then((d) => { tasasCache = { data: d, at: Date.now() }; return d; });
  }
  function rateSeries(kind, data) {
    const k = RATE_KINDS[kind];
    let pts = ((data && data[k.series]) || []).map((a) => ({ d: a[0], v: Number(a[1]) })).filter((p) => isFinite(p.v) && p.v > 0);
    let own = false;
    if (kind === "usdt" && !pts.length) { // sin historial del mercado todavía: se muestra la tasa propia de la app
      const v = Number(STATE.rates.USDT_VES && STATE.rates.USDT_VES.value);
      if (isFinite(v) && v > 0) { pts = [{ d: veToday(), v }]; own = true; }
    }
    return { pts, own };
  }

  function renderRates(kind) {
    if (kind) { ui.rateKind = kind; ui.rateRange = ui.rateRange || "30"; ui.rateSel = null; }
    if (ui.view !== "rates") { try { history.pushState({ rates: 1 }, ""); } catch (e) { /* sin historial: el botón ← igual funciona */ } }
    ui.view = "rates";
    drawRatesShell("loading");
    loadTasas().then((data) => { if (ui.view === "rates") { ui.rateData = data; drawRatesShell("ready"); } })
      .catch(() => { if (ui.view === "rates") drawRatesShell("error"); });
    window.scrollTo(0, 0);
  }
  function leaveRates() { if (history.state && history.state.rates) history.back(); else renderCalc(); }

  function drawRatesShell(state) {
    const k = RATE_KINDS[ui.rateKind];
    const body = state === "loading" ? `<div class="card rate-card"><div class="hint" style="margin:0">${esc(tt("rate_loading"))}</div></div>`
      : state === "error" ? `<div class="alert" style="margin-bottom:12px">${esc(tt("rate_error"))}</div><button class="primary" id="rate-retry">${esc(tt("rate_retry"))}</button>`
      : `<div id="rate-body"></div>`;
    app.innerHTML = `
      <header class="top rate-top">
        <button class="icon-btn" id="menu-btn" aria-label="${esc(tt("menu_open"))}">☰</button>
        <h1 class="rate-title">${esc(tt(k.titleKey))}</h1>
        <span style="width:44px;flex:none"></span>
      </header>${body}`;
    $("#menu-btn").onclick = openMenu;
    if ($("#rate-retry")) $("#rate-retry").onclick = () => { tasasCache = null; renderRates(); };
    if (state === "ready") drawRatesBody();
  }

  /** Dibuja la gráfica (SVG) y devuelve el HTML fijo más una función que pinta solo el punto seleccionado. */
  function buildChart(pts, todayIdx, k) {
    const W = 340, H = 212, L = 6, R = 44, T = 34, B = 28, n = pts.length, iw = W - L - R, ih = H - T - B;
    const X = (i) => L + (n === 1 ? iw / 2 : (i * iw) / (n - 1));
    let min = Math.min.apply(null, pts.map((p) => p.v)), max = Math.max.apply(null, pts.map((p) => p.v));
    if (max - min < 1e-9) { min -= 1; max += 1; }
    const pad = (max - min) * 0.1; min -= pad; max += pad;
    const Y = (v) => T + ih * (1 - (v - min) / (max - min));
    const span = max - min, ld = span > 3 ? 0 : 1; // pocos decimales para que la etiqueta quepa en el eje
    let grid = "";
    for (let g = 0; g < 4; g++) {
      const v = max - (span * g) / 3, yy = Y(v).toFixed(1);
      grid += `<line class="ch-grid" x1="${L}" x2="${W - R + 6}" y1="${yy}" y2="${yy}"/><text class="ch-txt" x="${W - R + 10}" y="${(Number(yy) + 4).toFixed(1)}">${fmtNum(v, ld)}</text>`;
    }
    const seg = (a, b) => pts.slice(a, b + 1).map((p, j) => (j ? "L" : "M") + X(a + j).toFixed(1) + " " + Y(p.v).toFixed(1)).join("");
    let lines = `<path class="ch-line" style="stroke:${k.color}" d="${seg(0, todayIdx)}"/>`;
    if (todayIdx < n - 1) lines += `<path class="ch-line" style="stroke:${k.color}" stroke-dasharray="3 6" d="${seg(todayIdx, n - 1)}"/>`;
    const long = n > 120, lab = (iso) => (long ? iso.slice(5, 7) + "/" + iso.slice(2, 4) : iso.slice(8, 10) + "/" + iso.slice(5, 7));
    const xl = `<text class="ch-txt" x="${L}" y="${H - 8}">${lab(pts[0].d)}</text><text class="ch-txt" x="${W - R + 6}" y="${H - 8}" text-anchor="end">${lab(pts[n - 1].d)}</text>`;
    const tx = X(todayIdx), ty = Y(pts[todayIdx].v), px = Math.min(Math.max(tx - 22, 0), W - 44);
    const today = `<line class="ch-today" x1="${tx.toFixed(1)}" x2="${tx.toFixed(1)}" y1="${T - 6}" y2="${H - B}"/>
      <rect class="ch-pill" x="${px.toFixed(1)}" y="4" width="44" height="22" rx="8"/>
      <text class="ch-pill-txt" x="${(px + 22).toFixed(1)}" y="19" text-anchor="middle">${esc(tt("rate_today"))}</text>
      <circle class="ch-dot" style="stroke:${k.color}" cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="5.5"/>`;
    return {
      W, L, R,
      html: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tt(k.titleKey))}">${grid}${lines}${xl}${today}<g id="ch-sel"></g></svg>`,
      selHtml: (i) => {
        if (i === todayIdx) return "";
        const sx = X(i).toFixed(1);
        return `<line class="ch-grid" style="stroke:var(--muted)" x1="${sx}" x2="${sx}" y1="${T - 6}" y2="${H - B}"/><circle class="ch-dot" style="stroke:${k.color}" cx="${sx}" cy="${Y(pts[i].v).toFixed(1)}" r="5.5"/>`;
      }
    };
  }

  function drawRatesBody() {
    const k = RATE_KINDS[ui.rateKind], box = $("#rate-body"); if (!box) return;
    const rs = rateSeries(ui.rateKind, ui.rateData), all = rs.pts;
    if (!all.length) { box.innerHTML = `<div class="card rate-card"><div class="hint" style="margin:0">${esc(tt("rate_no_data"))}</div></div><p class="rate-note">${esc(tt(k.src))}</p>`; return; }
    const today = veToday(), cut = dayShift(today, -Number(ui.rateRange || 30));
    const pts = all.filter((p) => p.d >= cut);
    let todayIdx = -1; pts.forEach((p, i) => { if (p.d <= today) todayIdx = i; });
    if (todayIdx < 0) todayIdx = 0;
    const chart = pts.length ? buildChart(pts, todayIdx, k) : null;

    box.innerHTML = `
      <div class="card rate-card"><div class="rate-row" id="rate-info"></div></div>
      <div class="card rate-card">
        <div class="rate-tabs" role="tablist">${RATE_RANGES.map((r) => `<button data-r="${r[0]}" role="tab" aria-selected="${ui.rateRange === r[0]}">${r[0] === "365" ? esc(tt("rate_range_1y")) : r[1]}</button>`).join("")}</div>
        <div class="chart-wrap" id="chart-box">${chart ? chart.html : `<div class="hint" style="margin:8px 0">${esc(tt("rate_no_data"))}</div>`}</div>
        <div class="rate-date" id="rate-date"></div>
      </div>
      <p class="rate-note">${esc(tt(k.src))}</p>${rs.own ? `<p class="rate-note">${esc(tt("rate_usdt_own"))}</p>` : ""}`;

    const paint = () => {
      const list = pts.length ? pts : all;
      let sel = ui.rateSel == null || ui.rateSel >= list.length ? (pts.length ? todayIdx : list.length - 1) : ui.rateSel;
      const cur = list[sel], gi = all.findIndex((p) => p.d === cur.d), prev = gi > 0 ? all[gi - 1] : null;
      const delta = prev ? cur.v - prev.v : null, pct = prev ? (delta / prev.v) * 100 : null;
      const dir = delta == null || Math.abs(delta) < 0.00005 ? "flat" : delta > 0 ? "up" : "down";
      $("#rate-info").innerHTML = `<div class="rate-label">${esc(tt(k.labelKey))}</div>
        <div class="rate-val ${dir}"><strong>${dir === "up" ? "↑ " : dir === "down" ? "↓ " : ""}<span style="color:var(--ink)">${esc(fmtNum(cur.v, k.dec))} Bs</span></strong>
        ${delta == null ? "" : `<div class="rate-delta">${delta > 0.00005 ? "+" : ""}${esc(fmtNum(delta, 2))} Bs (${esc(fmtPct(pct))}%)</div>`}</div>`;
      $("#rate-date").innerHTML = `<span aria-hidden="true">📅</span><span>${esc(tt("rate_selected_date", { date: fmtDay(cur.d) }))}</span>`;
      if (chart && $("#ch-sel")) $("#ch-sel").innerHTML = chart.selHtml(sel);
    };
    paint();

  var pendingUpdate = null;

      if (!latest || !(latest.versionCode > installed.versionCode)) return;
      pendingUpdate = latest;

    }).catch(() => { /* sin conexión: no se muestra nada, no es un error grave */ });
  }
  function maybeShowUpdateBanner() {
    if (!pendingUpdate) return;
    if (store.get("dismissedUpdate") === pendingUpdate.versionCode) return; // el usuario ya dijo "más tarde" para esta versión

  }

  readLiveBcv();
  setInterval(readLiveBcv, 4000);
  checkAppUpdate();
  (async function initRuntime() {
    try {
      if (!window.claude || typeof window.claude.use !== "function") return;
      const [user, artifact] = await Promise.all([window.claude.use("user"), window.claude.use("artifact")]);

      }

  })();
})();

  /* ---------- El enlace de un operador (?op=codigo) asigna a sus clientes ---------- */
  const OP_KEY = "remesas:client_op", OP_TTL = 45 * 24 * 3600 * 1000;
  function readStoredOp() { try { const o = JSON.parse(localStorage.getItem(OP_KEY) || "null"); return o && o.slug && Date.now() - (o.at || 0) < OP_TTL ? o : null; } catch (e) { return null; } }
  function storeOp(o) { try { if (o) localStorage.setItem(OP_KEY, JSON.stringify(Object.assign({ at: Date.now() }, o))); else localStorage.removeItem(OP_KEY); } catch (e) { /* sin almacenamiento */ } }

    if (!slug && stored) slug = stored.slug;

  /**
   * Avisa cuando el cliente TERMINA una operación (ya con el beneficiario cargado,
   * no apenas la empieza), porque recién ahí hay datos bancarios que mostrar.
   */
  function startOpsWatcher() {
    if (OP._watching) return;
    OP._watching = true;
    let first = true;
    const notified = new Set();
    // Cada quien se entera solo de lo suyo: el GM de las órdenes sin operador; el operador de las que llevan su UID.
    const mine = (o) => (OP.role === "operator" ? o.operatorUid === OP.myUid : ownerOf(o) === MAIN);
    const q = OP.role === "operator"
      ? db.collection("operations").where("operatorUid", "==", OP.myUid)
      : db.collection("operations").orderBy("createdAt", "desc").limit(30);
    OP._watchUnsub = q.onSnapshot((snap) => {
      if (first) {
        first = false;
        // Las que ya estaban completas antes de conectar no cuentan como "nuevas".
        snap.docs.forEach((d) => { if (getBeneficiaries(d.data())) notified.add(d.id); });
        return;
      }
      snap.docChanges().forEach((ch) => {
        if (ch.type === "removed") return;
        const o = ch.doc.data();
        if (!mine(o)) return;
        if (getBeneficiaries(o) && !notified.has(ch.doc.id)) { notified.add(ch.doc.id); notifyNewOperation(o); }
      });
    }, (err) => { console.error("vigilante de operaciones:", err); });
  }
  function stopOpsWatcher() { try { if (OP._watchUnsub) OP._watchUnsub(); } catch (e) { /* ya cerrado */ } OP._watchUnsub = null; OP._watching = false; }

  /**
   * Comprime una foto y la devuelve como data URI, reduciendo tamaño y calidad
   * hasta quedar bajo maxBytes (los comprobantes se guardan dentro del propio
   * documento de la operación, así que deben ser livianos: no usamos Storage
   * porque Firebase ahora exige una cuenta de facturación para activarlo).
   */
  function compressImage(file, maxBytes) {
    return new Promise((resolve, reject) => {
      if (!/^image\//.test(file.type)) return reject(new Error("Por ahora solo se aceptan fotos (no PDF)."));
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const dims = [1280, 1000, 800, 650, 500];
          const qualities = [0.72, 0.55, 0.4, 0.3];
          for (const dim of dims) {
            const scale = Math.min(1, dim / Math.max(img.width, img.height));
            const cv = document.createElement("canvas");
            cv.width = Math.max(1, Math.round(img.width * scale)); cv.height = Math.max(1, Math.round(img.height * scale));
            cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
            for (const q of qualities) {
              const data = cv.toDataURL("image/jpeg", q);
              if (data.length <= maxBytes) return resolve(data);
            }
          }
          reject(new Error("La foto sigue pesando mucho incluso comprimida. Prueba con otra foto o mejor luz."));
        };
        img.onerror = () => reject(new Error("No se pudo leer la imagen."));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error("No se pudo leer el archivo."));
      reader.readAsDataURL(file);
    });
  }

  function screenPayment(app) {

  function screenReceipt(app) {
    const q = OP.draftQuote;
    app.innerHTML = header(tt("ops_r_title"), tt("ops_step", { n: 3 }), tt("ops_back"), true) + inAppBrowserBanner() + `

        <label class="field"><span>${esc(tt("ops_r_reference"))}</span><input class="input" id="r-ref" placeholder="${esc(tt("ops_r_reference_ph"))}"></label>

  function fieldInput(f, val, T) {
    const key = f[0], label = T ? fieldLabelT(key) : f[1], type = f[2];
    if (type.indexOf("select:") === 0) {
      const opts = type.slice(7).split(",");
      return `<label class="field"><span>${esc(label)}</span><select data-f="${key}">${opts.map((o) => `<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
    }
    return `<label class="field"><span>${esc(label)}</span><input class="input" data-f="${key}" type="${type === "tel" ? "tel" : type === "email" ? "email" : "text"}" value="${esc(val || "")}"></label>`;
  }
  /** Convierte los distintos formatos guardados (viejo singular / nuevo arreglo) en un arreglo uniforme. */
  function getBeneficiaries(o) {
    if (Array.isArray(o.beneficiaries)) return o.beneficiaries;
    if (o.beneficiary) return [{ method: o.beneficiary.method, fields: o.beneficiary.fields, amount: o.amounts.receive }];
    return null;
  }
  const MAX_SPLIT = 5;
  /** Recalcula y pinta SOLO el número de "restante por asignar", sin reconstruir toda la pantalla
   *  (si se reconstruye todo en cada tecla, el campo de monto pierde el foco y se cierra el teclado). */
  function updateRemaining() {
    const el = document.getElementById("ben-remaining-val"); if (!el) return;
    const total = OP.op.amounts.receive;
    const assigned = OP.benList.reduce((s, b) => s.plus(new Decimal(C.parseNumber(b.amount) || 0)), new Decimal(0));
    const remaining = new Decimal(total).minus(assigned);
    el.textContent = remaining.toFixed(2) + " " + OP.draftQuote.toCurrency;
    el.style.color = remaining.eq(0) ? "inherit" : "var(--danger)";
  }
  function screenBeneficiary(app) {
    const q = OP.draftQuote, country = q.to.id;
    const methods = COUNTRY_METHODS[country].recv;
    if (OP.preferBen) {
      const pb = OP.preferBen; OP.preferBen = null;
      if (Date.now() - pb.at < 30 * 60 * 1000 && pb.country === country && methods.indexOf(pb.method) !== -1) { OP.chosenBenMethod = pb.method; OP.benForm = Object.assign({}, pb.fields); OP.saveBen = false; OP.multiBen = false; }
    }
    if (!OP.chosenBenMethod || methods.indexOf(OP.chosenBenMethod) === -1) OP.chosenBenMethod = methods[0];

    if (OP.multiBen === undefined) OP.multiBen = false;
    if (!OP.benList || !OP.benList.length) OP.benList = [{ method: OP.chosenBenMethod, amount: "", form: {} }, { method: OP.chosenBenMethod, amount: "", form: {} }];
    const total = OP.op.amounts.receive; // string, ya redondeado
    const D = Decimal;

    if (!OP.multiBen) {
      // ---------- Modo normal: un solo beneficiario (igual que siempre) ----------

      const saved = OP.myBeneficiaries.filter((b) => b.method === OP.chosenBenMethod);
      app.innerHTML = header(tt("ops_b_title"), tt("ops_b_step", { country: countryNameT(q.to) }), tt("ops_back"), true) + `

          <button class="primary" id="b-next" style="margin-top:0">${esc(tt("ops_b_next"))}</button>
