name: Actualizar tasas
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_tasas.py
      - name: Guardar cambios
        run: |
          if ! git diff --quiet -- tasas.json; then
            git config user.name "tasas-bot"
            git config user.email "tasas-bot@users.noreply.github.com"
            git add tasas.json
            git commit -m "Actualizar tasas"
            git pull --rebase origin main
            git push
          fi
